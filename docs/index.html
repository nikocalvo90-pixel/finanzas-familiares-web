<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>Finanzas Familiares · Staging</title>
<style>
:root{--bg:#07101d;--panel:#0d1727;--panel2:#101d31;--line:rgba(255,255,255,.085);--text:#eef4ff;--muted:#8ea2ba;--purple:#806cff;--green:#46d5ad;--red:#ff7d8a;--blue:#67bdff;--orange:#f1a06d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% -10%,rgba(80,70,190,.45),transparent 32%),var(--bg);color:var(--text)}
button,input{font:inherit}button{cursor:pointer}.shell{width:min(1180px,100%);margin:auto;padding:22px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#806cff,#42d6b5);font-weight:900;font-size:22px}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:900;letter-spacing:.12em;color:#ffd1a3;background:rgba(241,160,109,.11);border:1px solid rgba(241,160,109,.24);padding:7px 10px;border-radius:999px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#152339;color:#edf4ff;padding:10px 13px;border-radius:13px;font-weight:750}.btn:hover{background:#1a2b46}.hero{margin:10px 0 18px}.hero h1{font-size:clamp(34px,5vw,56px);line-height:.98;letter-spacing:-.055em;margin:8px 0}.hero p{color:var(--muted);margin:0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:18px 0}.metric,.panel{border:1px solid var(--line);background:linear-gradient(160deg,rgba(15,26,44,.98),rgba(10,18,31,.98));border-radius:19px;box-shadow:0 16px 45px rgba(0,0,0,.13)}.metric{padding:15px;min-width:0}.metric span{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.metric strong{display:block;font-size:22px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric small{display:block;margin-top:5px;color:#6e829b}.green{color:#66deba!important}.red{color:#ff929e!important}.blue{color:#7bc8ff!important}.purple{color:#a99cff!important}.orange{color:#ffc08e!important}.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(310px,.7fr);gap:14px;margin-bottom:14px}.panel{padding:17px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.panel h2{font-size:18px;margin:0}.panel .sub{color:var(--muted);font-size:11px}.rows{display:grid}.tx{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.055)}.tx:last-child,.item:last-child{border-bottom:0}.ico{width:38px;height:38px;border-radius:12px;background:#17243a;display:grid;place-items:center;font-weight:900}.ico.in{background:rgba(70,213,173,.11);color:#66deba}.ico.out{background:rgba(255,125,138,.11);color:#ff929e}.ico.neutral{background:rgba(103,189,255,.1);color:#7bc8ff}.tx-main{min-width:0}.tx-main b,.tx-main span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx-main b{font-size:13px}.tx-main span{font-size:11px;color:#71849c;margin-top:3px}.amt{font-weight:850;font-size:13px;white-space:nowrap}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.055)}.item span{color:#8fa2b9;font-size:12px}.item strong{white-space:nowrap}.net{display:grid;gap:8px}.net .item{padding:8px 0}.trend{width:100%;border-collapse:collapse;font-size:12px}.trend th{color:#71849c;font-weight:650;text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}.trend th:first-child,.trend td:first-child{text-align:left}.trend td{text-align:right;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.045)}.notice{margin-top:14px;padding:12px 14px;border:1px solid rgba(103,189,255,.2);background:rgba(103,189,255,.06);border-radius:14px;color:#a9cce5;font-size:12px;line-height:1.45}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;color:#8ea2ba}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(450px,100%);background:#0d1727;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.35)}.login-card h1{font-size:34px;line-height:1.02;letter-spacing:-.04em;margin:14px 0 9px}.login-card p{color:#91a3bc;line-height:1.5}.field{display:grid;gap:7px;margin-top:14px;font-size:12px;font-weight:700;color:#a4b5ca}.field input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#091321;color:#eef4ff;outline:none}.primary{width:100%;border:0;border-radius:14px;padding:13px 16px;margin-top:17px;background:linear-gradient(135deg,#806cff,#6179ff);color:white;font-weight:850}.status{margin-top:14px;padding:11px 13px;border-radius:13px;background:#091321;color:#a9bad0;font-size:12px}.err{color:#ff9aa5}.empty{padding:24px 0;color:#71849c;text-align:center;font-size:12px}
@media(max-width:900px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
@media(max-width:560px){.shell{padding:14px 12px 50px}.top{align-items:flex-start}.brand small{display:none}.actions .btn{padding:9px 10px}.hero h1{font-size:38px}.metrics{gap:8px}.metric{padding:13px}.metric strong{font-size:19px}.panel{padding:14px}.tx{grid-template-columns:38px minmax(0,1fr) auto}.ico{width:35px;height:35px}.hide-mobile{display:none}}
</style>
</head>
<body>
<div id="root"><div class="loading"><div><div class="logo" style="margin:auto">F</div><p>Recuperando sesión y leyendo tus datos…</p></div></div></div>
<script>
(function(){
const SUPA='https://lqsoxkoiwczouhvefmgg.supabase.co';
const KEY=['sb_publishable_ctmNZLxW2y5f_','7CJJ8FDMw_xyRqnRT_'].join('');
const STORE='ff_session_github_staging_v1';
const root=document.getElementById('root');
const eur=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2});
const monthFmt=new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'});
const dateFmt=new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>eur.format(Number(v||0));
const getSession=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}};
const saveSession=s=>localStorage.setItem(STORE,JSON.stringify(s));
const clearSession=()=>localStorage.removeItem(STORE);
async function request(path,opt={}){
 const headers=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});
 const r=await fetch(SUPA+path,Object.assign({},opt,{headers}));
 const t=await r.text(); let d=null; try{d=t?JSON.parse(t):null}catch{d=t}
 if(!r.ok) throw new Error((d&&((d.message)||(d.msg)||(d.error_description)))||('HTTP '+r.status));
 return d;
}
async function currentUser(token){return request('/auth/v1/user',{headers:{Authorization:'Bearer '+token}})}
async function refreshSession(s){
 const d=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh_token})});
 saveSession(d); return d;
}
async function restore(){
 const s=getSession(); if(!s)return null;
 try{const u=await currentUser(s.access_token);return {session:s,user:u}}
 catch(e){try{const n=await refreshSession(s);const u=await currentUser(n.access_token);return {session:n,user:u}}catch{clearSession();return null}}
}
async function login(email,password){
 const d=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
 saveSession(d); return {session:d,user:d.user||await currentUser(d.access_token)};
}
async function authed(path,opt={}){
 let s=getSession(); if(!s)throw new Error('No hay sesión');
 const headers=Object.assign({Authorization:'Bearer '+s.access_token},opt.headers||{});
 try{return await request(path,Object.assign({},opt,{headers}))}
 catch(e){
   if(!s.refresh_token)throw e;
   s=await refreshSession(s);
   return request(path,Object.assign({},opt,{headers:Object.assign({},headers,{Authorization:'Bearer '+s.access_token})}));
 }
}
const rest=(resource,query)=>authed('/rest/v1/'+resource+(query?'?'+query:''));
const rpc=(name,body)=>authed('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(body)});
function localMonth(){
 const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
}
function monthName(iso){
 const [y,m]=iso.split('-').map(Number); return monthFmt.format(new Date(y,m-1,1));
}
function typeMeta(t){
 if(t==='INGRESO')return {icon:'+',cls:'in',sign:'+'};
 if(t==='DEVOLUCION')return {icon:'↩',cls:'in',sign:'+'};
 if(t==='RETIRADA_INVERSION')return {icon:'↙',cls:'in',sign:'+'};
 if(t==='GASTO')return {icon:'−',cls:'out',sign:'−'};
 if(t==='INVERSION')return {icon:'↗',cls:'out',sign:'−'};
 return {icon:'↔',cls:'neutral',sign:''};
}
function renderLogin(msg){
 root.innerHTML='<div class="login"><main class="login-card"><span class="badge">STAGING · PRUEBA 2</span><div class="logo">F</div><h1>Finanzas Familiares</h1><p>Lectura real de tus datos. Esta prueba no puede crear, editar ni borrar movimientos.</p><label class="field">Email<input id="email" type="email" autocomplete="email"></label><label class="field">Contraseña<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="login">Entrar</button><div class="status" id="status">'+esc(msg||'Inicia sesión para continuar.')+'</div></main></div>';
 document.getElementById('login').onclick=async()=>{
   const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
   const st=document.getElementById('status');
   if(!email||!password){st.textContent='Introduce email y contraseña.';st.className='status err';return}
   st.textContent='Entrando…'; st.className='status';
   try{const auth=await login(email,password);await renderDashboard(auth.user)}
   catch(e){st.textContent=e.message;st.className='status err'}
 };
}
async function renderDashboard(user){
 root.innerHTML='<div class="loading"><div><div class="logo" style="margin:auto">F</div><p>Leyendo hogar, métricas y movimientos…</p></div></div>';
 try{
   const members=await rest('household_members','user_id=eq.'+encodeURIComponent(user.id)+'&select=household_id,role,display_name&limit=1');
   if(!members||!members.length)throw new Error('Tu usuario no está vinculado a ningún hogar.');
   const h=members[0].household_id, month=localMonth();
   const households=await rest('households','id=eq.'+h+'&select=id,name&limit=1');
   const [metricsRows,nwRows,trend,cats,txs,accounts,investments]=await Promise.all([
     rpc('monthly_metrics',{p_household:h,p_month:month}),
     rpc('net_worth_summary',{p_household:h}),
     rpc('monthly_financial_trend',{p_household:h,p_months:3}),
     rest('categories','household_id=eq.'+h+'&select=id,name'),
     rest('transactions','household_id=eq.'+h+'&select=id,transaction_date,amount,type,concept,category_id,person_label&order=transaction_date.desc,created_at.desc&limit=14'),
     rest('account_balances_current','household_id=eq.'+h+'&select=id,name,type,currency,current_balance,include_in_cash,include_in_net_worth&order=name.asc'),
     rest('investment_values_current','household_id=eq.'+h+'&select=id,name,provider,asset_type,currency,current_value,valuation_date&order=name.asc')
   ]);
   const metrics=(metricsRows&&metricsRows[0])||{}, nw=(nwRows&&nwRows[0])||{};
   const catMap=Object.fromEntries((cats||[]).map(c=>[c.id,c.name]));
   const cashOut=Number(metrics.expenses||0)+Number(metrics.invested||0);
   const householdName=(households&&households[0]&&households[0].name)||'Familia';
   const txHtml=(txs||[]).map(t=>{
      const meta=typeMeta(t.type), cat=catMap[t.category_id]||'Sin categoría';
      const d=new Date(t.transaction_date+'T12:00:00');
      return '<div class="tx"><div class="ico '+meta.cls+'">'+meta.icon+'</div><div class="tx-main"><b>'+esc(t.concept)+'</b><span>'+esc(cat)+' · '+esc(t.person_label||'Familia')+' · '+dateFmt.format(d)+'</span></div><div class="amt '+(meta.cls==='in'?'green':meta.cls==='out'?'red':'blue')+'">'+meta.sign+money(t.amount)+'</div></div>';
   }).join('')||'<div class="empty">No hay movimientos.</div>';
   const accHtml=(accounts||[]).map(a=>'<div class="item"><div><strong>'+esc(a.name)+'</strong><br><span>'+esc(a.type)+'</span></div><strong>'+money(a.current_balance)+'</strong></div>').join('')||'<div class="empty">Sin cuentas.</div>';
   const invHtml=(investments||[]).map(i=>'<div class="item"><div><strong>'+esc(i.name)+'</strong><br><span>'+esc(i.provider||i.asset_type||'Inversión')+'</span></div><strong>'+money(i.current_value)+'</strong></div>').join('')||'<div class="empty">Sin inversiones.</div>';
   const trendHtml=(trend||[]).map(r=>'<tr><td>'+esc(monthName(r.month))+'</td><td class="green">'+money(r.income)+'</td><td class="red">'+money(r.expenses)+'</td><td class="purple">'+money(r.invested)+'</td><td>'+money(r.normalized_cost)+'</td></tr>').join('');
   root.innerHTML='<div class="shell">'+
    '<header class="top"><div class="brand"><div class="logo">F</div><div><b>Finanzas Familiares</b><small>'+esc(householdName)+' · '+esc(user.email||'')+'</small></div></div><div class="actions"><span class="badge">SOLO LECTURA · PRUEBA 2</span><button class="btn" id="reload">Actualizar</button><button class="btn" id="logout">Cerrar sesión</button></div></header>'+
    '<section class="hero"><span class="badge">'+esc(monthName(month))+'</span><h1>Vuestras finanzas,<br>sin tocar ningún dato.</h1><p>Estamos comprobando lectura real, cálculos y patrimonio sobre GitHub Pages + Supabase.</p></section>'+
    '<section class="metrics">'+
      '<div class="metric"><span>Ingresos</span><strong class="green">'+money(metrics.income)+'</strong><small>Caja cobrada</small></div>'+
      '<div class="metric"><span>Gastos reales</span><strong class="red">'+money(metrics.expenses)+'</strong><small>Consumo pagado</small></div>'+
      '<div class="metric"><span>Salidas de caja</span><strong class="orange">'+money(cashOut)+'</strong><small>Gasto + inversión</small></div>'+
      '<div class="metric"><span>Coste normalizado</span><strong>'+money(metrics.normalized_cost)+'</strong><small>Coste económico</small></div>'+
      '<div class="metric"><span>Ahorro operativo</span><strong class="'+(Number(metrics.operating_savings)>=0?'green':'red')+'">'+money(metrics.operating_savings)+'</strong><small>Ingresos + devoluciones − gastos</small></div>'+
      '<div class="metric"><span>Inversión</span><strong class="purple">'+money(metrics.invested)+'</strong><small>No se trata como gasto</small></div>'+
      '<div class="metric"><span>Devoluciones</span><strong class="blue">'+money(metrics.refunds)+'</strong><small>Entradas que reducen gasto</small></div>'+
      '<div class="metric"><span>Patrimonio neto</span><strong>'+money(nw.net_worth)+'</strong><small>Activos − deudas</small></div>'+
    '</section>'+
    '<section class="grid"><div class="panel"><div class="panel-head"><div><span class="sub">ACTIVIDAD</span><h2>Últimos movimientos</h2></div><span class="sub">'+(txs||[]).length+' visibles</span></div><div class="rows">'+txHtml+'</div></div>'+
      '<div class="panel"><div class="panel-head"><div><span class="sub">PATRIMONIO</span><h2>Composición</h2></div></div><div class="net">'+
      '<div class="item"><span>Cuentas</span><strong>'+money(nw.cash_accounts)+'</strong></div>'+
      '<div class="item"><span>Inversiones</span><strong>'+money(nw.investments)+'</strong></div>'+
      '<div class="item"><span>Otros activos</span><strong>'+money(nw.other_assets)+'</strong></div>'+
      '<div class="item"><span>Deudas</span><strong class="red">−'+money(nw.liabilities)+'</strong></div>'+
      '<div class="item"><span>Patrimonio neto</span><strong>'+money(nw.net_worth)+'</strong></div></div></div></section>'+
    '<section class="grid"><div class="panel"><div class="panel-head"><div><span class="sub">CUENTAS</span><h2>Saldos conocidos</h2></div></div>'+accHtml+'</div>'+
      '<div class="panel"><div class="panel-head"><div><span class="sub">INVERSIÓN</span><h2>Valor actual</h2></div></div>'+invHtml+'</div></section>'+
    '<section class="panel"><div class="panel-head"><div><span class="sub">EVOLUCIÓN</span><h2>Últimos 3 meses</h2></div></div><div style="overflow:auto"><table class="trend"><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Inversión</th><th>Normalizado</th></tr></thead><tbody>'+trendHtml+'</tbody></table></div>'+
    '<div class="notice"><strong>Modo seguro:</strong> esta versión solo realiza lecturas y RPCs de consulta. No contiene acciones para crear, editar o borrar movimientos, cuentas, cierres ni miembros.</div></section>'+
   '</div>';
   document.getElementById('reload').onclick=()=>renderDashboard(user);
   document.getElementById('logout').onclick=async()=>{
      const s=getSession();
      try{if(s?.access_token)await request('/auth/v1/logout',{method:'POST',headers:{Authorization:'Bearer '+s.access_token}})}catch(e){}
      clearSession();renderLogin('Sesión cerrada en este dispositivo.');
   };
 }catch(e){
   root.innerHTML='<div class="login"><main class="login-card"><span class="badge">STAGING · PRUEBA 2</span><div class="logo">F</div><h1>No he podido leer los datos</h1><p class="err">'+esc(e.message)+'</p><button class="primary" id="retry">Reintentar</button><div class="status">No se ha modificado ningún dato.</div></main></div>';
   document.getElementById('retry').onclick=()=>renderDashboard(user);
 }
}
(async()=>{
 const auth=await restore();
 if(auth)renderDashboard(auth.user); else renderLogin();
})();
})();
</script>
</body>
</html>
