 let type='GASTO',cat=null,confidence=.72,reason='Regla general: se propone gasto y debes confirmarlo.';
 if(/transfer|traspas/.test(n)){type='TRANSFERENCIA_INTERNA';cat=catByName('Transferencia');confidence=.96;reason='Palabra de transferencia detectada.'}
 else if(/retirada.*invers|rescatar.*fondo|reintegro.*invers/.test(n)){type='RETIRADA_INVERSION';cat=catByName('Retirada inversión','Retirada inversion');confidence=.94;reason='Retirada de inversión detectada.'}
 else if(/devolu|reembolso/.test(n)){type='DEVOLUCION';cat=catByName('Devoluciones');confidence=.96;reason='Devolución o reembolso detectado.'}
 else if(/interes/.test(n)){type='INGRESO';cat=catByName('Intereses');confidence=.98;reason='Ingreso por intereses detectado.'}
 else if(/nomina|sueldo/.test(n)){type='INGRESO';cat=catByName('Nómina','Nomina');confidence=.98;reason='Nómina o sueldo detectado.'}
 else if(/clases|dar clase/.test(n)){type='INGRESO';cat=catByName('Clases');confidence=.96;reason='Ingreso por clases detectado.'}
 else if(/ingreso|cobro/.test(n)){type='INGRESO';cat=catByName('Otros ingresos');confidence=.86;reason='Palabra de ingreso o cobro detectada.'}
 else if(/invers|fondos? index|aportacion.*fondo|aportación.*fondo/.test(n)){type='INVERSION';cat=catByName('Inversión','Inversion');confidence=.94;reason='Aportación o inversión detectada.'}
 else {
   if(/mercadona|supermerc|fruter|alimentacion|alimentación/.test(n)){cat=catByName('Alimentación','Alimentacion');confidence=.96;reason='Comercio o palabra de alimentación reconocida.'}
   else if(/restaurante|hamburgues|montiz|comida fuera|cenar|cena /.test(n)){cat=catByName('Restaurantes');confidence=.9;reason='Restauración/comida fuera detectada.'}
   else if(/gimnasio|gym|deporte/.test(n)){cat=catByName('Deporte');confidence=.97;reason='Gimnasio o deporte reconocido.'}
   else if(/limpieza|jaidi|nuria/.test(n)){cat=catByName('Limpieza');confidence=.93;reason='Limpieza doméstica detectada.'}
   else if(/tesla|carga coche|garaje|gasolina|coche/.test(n)){cat=catByName('Coche');confidence=.9;reason='Gasto de coche reconocido.'}
   else if(/regalo|cumple/.test(n)){cat=catByName('Regalos');confidence=.9;reason='Regalo o cumpleaños detectado.'}
   else if(/miguel|juguete|pañal|nino|niño/.test(n)){cat=catByName('Niños','Ninos');confidence=.9;reason='Gasto asociado a niños reconocido.'}
   else if(/seguro/.test(n)){cat=catByName('Seguros');confidence=.9;reason='Seguro detectado.'}
   else if(/ibi|impuesto|tasa/.test(n)){cat=catByName('Impuestos');confidence=.91;reason='Impuesto o tasa detectado.'}
   else if(/alquiler|hipoteca|comunidad|derrrama|derram/.test(n)){cat=catByName('Vivienda');confidence=.88;reason='Coste del inmueble detectado.'}
   else if(/frigorifico|frigorífico|mueble|sofa|sofá|lavadora|hogar/.test(n)){cat=catByName('Hogar');confidence=.86;reason='Equipamiento o mantenimiento del hogar detectado.'}
   else if(/farmacia|medicamento|medico|médico|dentista|salud/.test(n)){cat=catByName('Salud');confidence=.9;reason='Salud o farmacia detectada.'}
   else if(/luz|electricidad|agua|gas natural|fibra|internet|telefono|teléfono/.test(n)){cat=catByName('Suministros');confidence=.88;reason='Suministro doméstico detectado.'}
   else if(/spotify|netflix|icloud|suscripcion|suscripción/.test(n)){cat=catByName('Suscripciones');confidence=.88;reason='Suscripción detectada.'}
   else if(/hotel|vuelo|avion|avión|viaje/.test(n)){cat=catByName('Viajes');confidence=.88;reason='Viaje detectado.'}
   else if(/colegio|guarderia|guardería|curso|matricula|matrícula/.test(n)){cat=catByName('Educación','Educacion');confidence=.87;reason='Educación detectada.'}
   else {
     const hist=historicalSuggestion(concept);
     if(hist){cat=state.data.categories.find(c=>c.id===hist.category_id)||null;confidence=hist.confidence;reason=hist.reason}
     else{cat=catByName('Otros gastos');confidence=.55;reason='No hay coincidencia suficiente; revisa la categoría.'}
   }
 }
 if(type==='INVERSION'&&!cat)cat=catByName('Inversión','Inversion');
 if(type==='RETIRADA_INVERSION'&&!cat)cat=catByName('Retirada inversión','Retirada inversion');
 if(type==='TRANSFERENCIA_INTERNA'&&!cat)cat=catByName('Transferencia');
 if(type==='DEVOLUCION'&&!cat)cat=catByName('Devoluciones');
 return {raw:text,amount,concept,type,category_id:cat?.id||'',confidence,reason,date:todayISO()};
}

   const sheets=await buildWorkbookSheets(),blob=buildXlsx(sheets),name='Finanzas_Familia_'+todayISO()+'.xlsx',file=new File([blob],name,{type:blob.type});
   const fallback=()=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500)};
   if(navigator.canShare&&navigator.canShare({files:[file]})){
     try{await navigator.share({files:[file],title:'Finanzas Familiares'})}
     catch(e){if(e&&e.name==='AbortError')return;fallback()}
   }else fallback();
   toast('Excel acumulativo preparado');
 }catch(e){alert('No se pudo generar el Excel: '+e.message)}
}

function addDaysISO(days){const d=new Date();d.setDate(d.getDate()+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function memberName(id){return state.data.members.find(m=>m.user_id===id)?.display_name||'Familia'}
function taskDueText(t){
 if(!t.due_date)return 'Sin fecha';
 const today=todayISO(),tom=addDaysISO(1);
 if(t.due_date===today)return 'Hoy';
 if(t.due_date===tom)return 'Mañana';
 return new Date(t.due_date+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
}
function inferTask(raw){
 let title=String(raw||'').trim(),due='',assigned='',priority='NORMAL',category='';
 let n=norm(title);
 if(n.includes('hoy')){due=todayISO();title=title.replace(/\bhoy\b/i,'').trim()}
 else if(n.includes('mañana')||n.includes('manana')){due=addDaysISO(1);title=title.replace(/\bmañana\b|\bmanana\b/i,'').trim()}
 for(const m of state.data.members){
   const display=String(m.display_name||'').trim();if(!display)continue;
   const phrase='para '+norm(display);
   if(norm(title).includes(phrase)){
     const lower=title.toLowerCase(),rawPhrase='para '+display.toLowerCase(),idx=lower.indexOf(rawPhrase);
     assigned=m.user_id;
     if(idx>=0)title=(title.slice(0,idx)+title.slice(idx+rawPhrase.length)).trim();
     break;
   }
 }
 n=norm(title);
 if(n.includes('importante')||n.includes('urgente')){priority='IMPORTANTE';title=title.replace(/\b(importante|urgente)\b/ig,'').trim()}
 const nn=norm(title);
 if(/comprar|compra|supermerc|mercadona/.test(nn))category='Compras';
 else if(/miguel|colegio|nino|niño/.test(nn))category='Miguel';
 else if(/coche|tesla|astra|garaje/.test(nn))category='Coche';
 else if(/cita|llamar|pedir|renovar|gesti/.test(nn))category='Gestiones';
 else if(/casa|limpiar|limpieza|ordenar/.test(nn))category='Casa';
 return {title:title.replace(/^[-,:;]+|[-,:;]+$/g,'').trim()||String(raw||'').trim(),due_date:due,assigned_to_user_id:assigned,priority,category,notes:''}
}

 if(!id)payload.created_by=state.user.id;

 '<section class="metrics"><div class="metric"><span>Cuentas</span><strong>'+money(n.cash_accounts)+'</strong><small>Liquidez conocida</small></div><div class="metric"><span>Inversiones</span><strong class="purple">'+money(n.investments)+'</strong><small>Valor actual</small></div><div class="metric"><span>Otros activos</span><strong>'+money(n.other_assets)+'</strong><small>Bienes valorados</small></div><div class="metric"><span>Deudas</span><strong class="red">'+money(n.liabilities)+'</strong><small>Saldo pendiente</small></div></section>'+
 '<section class="recon-callout"><div class="panel-head"><div><span class="sub">Exactitud</span><h2>Conciliación patrimonial</h2></div><button class="btn" id="open-reconciliation">Conciliar saldos</button></div><p>'+recent+' de '+items.length+' elementos han sido comprobados en los últimos 30 días. Si el banco o broker no coincide con la app, guardaremos el saldo real como nueva referencia sin convertir la diferencia en gasto.</p></section>'+
 '<section class="grid equal"><div class="panel"><div class="panel-head"><div><span class="sub">Liquidez</span><h2>Cuentas</h2></div></div><div class="manage-list">'+state.data.accounts.map(a=>'<div class="manage-row"><div class="manage-main"><strong>'+esc(a.name)+'</strong><span>'+esc(a.institution||a.type)+'</span></div><div class="manage-side"><strong>'+money(a.current_balance)+'</strong><button class="mini" data-wealth-kind="account" data-wealth-id="'+a.id+'">Editar</button></div></div>').join('')+'</div></div><div class="panel"><div class="panel-head"><div><span class="sub">Carteras</span><h2>Inversiones</h2></div></div><div class="manage-list">'+state.data.investments.map(i=>'<div class="manage-row"><div class="manage-main"><strong>'+esc(i.name)+'</strong><span>'+esc(i.provider||i.asset_type||'Inversión')+'</span></div><div class="manage-side"><strong class="purple">'+money(i.current_value)+'</strong><button class="mini" data-wealth-kind="investment" data-wealth-id="'+i.id+'">Editar</button></div></div>').join('')+'</div></div></section>'+
 '<div class="section-title"><h2>Activos y deudas</h2><span class="sub">VALOR ACTUAL</span></div><section class="cards">'+state.data.assets.map(a=>entity('asset',a,a.current_value)).concat(state.data.liabilities.map(l=>entity('liability',l,l.outstanding_balance,'red'))).join('')+'</section>');
 bindCommon();bindWealthActions();document.getElementById('open-reconciliation').onclick=openReconciliationCenter
}
async function copyInviteLink(code){
 const u=new URL(location.origin+location.pathname);u.searchParams.set('invite',code);
 try{await navigator.clipboard.writeText(u.toString());toast('Enlace de invitación copiado')}
 catch(e){window.prompt('Copia este enlace y envíaselo:',u.toString())}
}
async function generateInvite(){
 try{const code=await createHouseholdInvite();await loadAll();renderApp();toast('Nuevo código: '+String(code||''))}
 catch(e){alert('No se pudo crear la invitación: '+e.message)}
}
function viewAjustes(){
 const now=Date.now(),active=(state.data.invites||[]).find(i=>!i.revoked_at&&Number(i.uses)<Number(i.max_uses)&&new Date(i.expires_at).getTime()>now),rr=state.data.recurring||[],activeRules=rr.filter(r=>r.active);
 const invitePanel=state.member?.role==='OWNER'?'<section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><span class="sub">Compartir hogar</span><h2>Invitaciones</h2></div></div>'+
   (active?'<p style="color:#8fa2b9;font-size:12px">Hay un código pendiente de uso y caduca el '+new Date(active.expires_at).toLocaleDateString('es-ES')+'.</p><div class="join-code">'+esc(active.code)+'</div><div class="invite-actions"><button class="btn" id="copy-invite">Copiar enlace</button><button class="btn" id="new-invite">Generar otro código</button></div>':'<p style="color:#8fa2b9;font-size:12px">No hay una invitación activa.</p><button class="btn" id="new-invite">Generar código</button>')+
   '</section>':'';
 const recurringPanel='<section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><span class="sub">Automatización</span><h2>Gastos e ingresos recurrentes</h2></div><button class="btn" id="new-recurring">+ Nuevo</button></div><div class="notice" style="margin:0 0 11px"><strong>'+activeRules.length+' reglas activas.</strong> '+rr.filter(r=>r.auto_post).length+' crean movimientos automáticamente al abrir o actualizar la app; el resto sirven como configuración/manual hasta que les asignéis cuenta y activéis el auto-registro.</div>'+(state.recurringRunError?'<div class="status err" style="margin:0 0 11px">No se pudo procesar un vencimiento automático: '+esc(state.recurringRunError)+'</div>':'')+'<div class="manage-list">'+(rr.length?rr.map(r=>'<div class="manage-row"><div class="manage-main"><strong>'+esc(r.name)+'</strong><span>'+esc((state.data.categories.find(c=>c.id===r.category_id)?.name||r.type)+' · '+recurringMeta(r))+'</span></div><div class="manage-side"><strong class="'+(r.type==='INGRESO'?'green':r.type==='INVERSION'?'purple':'')+'">'+money(r.amount)+'</strong><span class="state-chip '+(r.active?'on':'off')+'">'+(r.active?(r.auto_post?'AUTO':'ACTIVO'):'PAUSADO')+'</span><button class="mini" data-recurring="'+r.id+'">Editar</button></div></div>').join(''):'<div class="empty">No hay recurrentes configurados.</div>')+'</div></section>';
 const bioOn=lockApplies(),label=lockLabel();
 const securityPanel='<section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><span class="sub">Privacidad del dispositivo</span><h2>Bloqueo con '+esc(label)+'</h2></div><span class="state-chip '+(bioOn?'on':'off')+'">'+(bioOn?'ACTIVO':'OPCIONAL')+'</span></div><div class="security-card"><div class="security-head"><div><b>'+(bioOn?'Protección activada en este dispositivo':'Protege la app al abrirla')+'</b><p>'+(bioOn?'Tras 30 segundos fuera de la app, volverá a pedir '+esc(label)+'. La sesión de Supabase permanece guardada.':'La protección es local a este iPhone. No se guarda tu rostro ni ningún dato biométrico; iOS realiza la verificación.')+'</p></div></div><div class="invite-actions">'+(bioOn?'<button class="btn" id="lock-now">Bloquear ahora</button><button class="btn" id="disable-device-lock">Desactivar</button>':'<button class="btn" id="enable-device-lock">Activar '+esc(label)+'</button>')+'</div></div></section>';
 shell(head('Hogar y aplicación','Ajustes','Recurrentes, privacidad, miembros, sesión e invitaciones.')+
 recurringPanel+securityPanel+invitePanel+
 '<section class="grid equal"><div class="panel"><div class="panel-head"><div><span class="sub">Familia</span><h2>Miembros del hogar</h2></div></div>'+state.data.members.map(m=>'<div class="item"><div><strong>'+esc(m.display_name||'Miembro')+'</strong><br><span>'+esc(m.role)+'</span></div><span>'+new Date(m.joined_at).toLocaleDateString('es-ES')+'</span></div>').join('')+'</div>'+
 '<div class="panel"><div class="panel-head"><div><span class="sub">Aplicación</span><h2>Estado</h2></div></div><div class="settings-list"><div class="setting"><b>Sesión persistente</b><span>La app conserva y renueva la sesión. Un fallo de red ya no fuerza a introducir la contraseña otra vez.</span></div><div class="setting"><b>Privacidad local</b><span>'+esc(label)+' puede bloquear la interfaz sin cerrar la sesión.</span></div><div class="setting"><b>Patrimonio editable</b><span>Activa: saldos y valoraciones se guardan con fecha para conservar histórico.</span></div><div class="setting"><b>Actualizaciones</b><span>Versión '+APP_BUILD+' · la app comprueba nuevas versiones automáticamente.</span><div class="invite-actions"><button class="btn" id="check-update">Buscar actualización</button><button class="btn" id="force-refresh">Recargar app</button></div></div><div class="setting"><b>Backend</b><span>Supabase · hogar protegido por RLS y auditoría.</span></div><div class="setting"><b>Hosting</b><span>GitHub Pages.</span></div></div><button class="btn" id="logout" style="margin-top:12px">Cerrar sesión</button></div></section>');
 bindCommon();
 document.getElementById('new-recurring').onclick=()=>openRecurringEditor(null);document.querySelectorAll('[data-recurring]').forEach(b=>b.onclick=()=>openRecurringEditor(b.dataset.recurring));
 const enableLock=document.getElementById('enable-device-lock');if(enableLock)enableLock.onclick=async()=>{enableLock.disabled=true;enableLock.textContent='Activando…';try{await enableDeviceLock();renderApp();toast(lockLabel()+' activado')}catch(e){enableLock.disabled=false;enableLock.textContent='Activar '+lockLabel();alert(e.name==='NotAllowedError'?'No se completó la configuración biométrica.':e.message)}};
 const disableLock=document.getElementById('disable-device-lock');if(disableLock)disableLock.onclick=()=>{if(confirm('¿Desactivar el bloqueo biométrico en este dispositivo?')){clearDeviceLock();state.deviceUnlocked=false;renderApp();toast('Bloqueo biométrico desactivado')}};
 const lockNow=document.getElementById('lock-now');if(lockNow)lockNow.onclick=lockDeviceNow;
 const copy=document.getElementById('copy-invite');if(copy&&active)copy.onclick=()=>copyInviteLink(active.code);
 const ni=document.getElementById('new-invite');if(ni)ni.onclick=generateInvite;
 const cu=document.getElementById('check-update');if(cu)cu.onclick=()=>checkAppUpdate(true);
 const fr=document.getElementById('force-refresh');if(fr)fr.onclick=forceAppRefresh;
 document.getElementById('logout').onclick=async()=>{const ss=getSession();try{if(ss?.access_token)await request('/auth/v1/logout',{method:'POST',headers:{Authorization:'Bearer '+ss.access_token}})}catch(e){}clearSession();state.user=null;renderLogin('Sesión cerrada en este dispositivo.','login')}
}
function renderApp(){startAutoSync();installBackgroundLock();const v=currentView();if(v==='movimientos')viewMovimientos();else if(v==='tareas')viewTareas();else if(v==='analisis')viewAnalisis();else if(v==='patrimonio')viewPatrimonio();else if(v==='ajustes')viewAjustes();else viewInicio()}
window.addEventListener('hashchange',()=>{if(state.data)renderApp()});
(async()=>{
 checkAppUpdate(false);
 setInterval(()=>{if(!document.hidden)checkAppUpdate(false)},300000);
 rememberInviteFromUrl();
 const redirect=consumeAuthRedirect();
 try{
   const a=await restore();
   if(!a)return renderLogin(redirect.error?('No se pudo confirmar el acceso: '+redirect.error):undefined);
   state.user=a.user;
   if(lockApplies(a.user)&&!state.deviceUnlocked){renderDeviceLock();return}
   await finishAuthenticated(a.user);
 }catch(e){if(getSession())renderSessionIssue(e.message);else renderLogin('No se pudo cargar la app: '+e.message)}
})();
})();
</script>
