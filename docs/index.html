tent:flex-end;gap:9px;margin-top:15px}.save{border:0;background:linear-gradient(135deg,#806cff,#6179ff);color:white;padding:11px 15px;border-radius:13px;font-weight:850}.save:disabled{opacity:.5}.toast{position:fixed;z-index:300;left:50%;bottom:90px;transform:translateX(-50%);padding:11px 14px;border-radius:13px;background:#11372f;border:1px solid rgba(70,213,173,.28);color:#d9fff4;font-size:12px;box-shadow:0 16px 45px rgba(0,0,0,.3)}@media(max-width:760px){.modal-back{padding:0;align-items:end}.modal{border-radius:24px 24px 0 0;padding:18px 14px calc(20px + env(safe-area-inset-bottom));max-height:94vh}.edit-grid{grid-template-columns:1fr}.edit-grid .wide{grid-column:auto}.modal-actions{position:sticky;bottom:0;background:linear-gradient(0deg,#0a1423 75%,transparent);padding-top:12px}.save{flex:1}}@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}

<body>
<div id="root"><div class="loading"><div><div class="logo" style="margin:auto">F</div><p>Recuperando sesión…</p></div></div></div>
<script>
(function(){
const SUPA='https://lqsoxkoiwczouhvefmgg.supabase.co';
const KEY=['sb_publishable_ctmNZLxW2y5f_','7CJJ8FDMw_xyRqnRT_'].join('');
const STORE='ff_session_github_staging_v1';
const root=document.getElementById('root');
const eur=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2});
const monthFmt=new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'});
const dateFmt=new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const state={user:null,household:null,member:null,data:null,draft:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>eur.format(Number(v||0));
const getSession=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}};
const saveSession=s=>localStorage.setItem(STORE,JSON.stringify(s));
const clearSession=()=>localStorage.removeItem(STORE);
async function request(path,opt={}){
 const headers=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});
 const r=await fetch(SUPA+path,Object.assign({},opt,{headers}));
 const t=await r.text(); let d=null; try{d=t?JSON.parse(t):null}catch{d=t}
 if(!r.ok) throw new Error((d&&((d.message)||(d.msg)||(d.error_description)))||('HTTP '+r.status));
 return d;
}
async function currentUser(token){return request('/auth/v1/user',{headers:{Authorization:'Bearer '+token}})}
async function refreshSession(s){const d=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh_token})});saveSession(d);return d}
async function restore(){const s=getSession();if(!s)return null;try{return{session:s,user:await currentUser(s.access_token)}}catch(e){try{const n=await refreshSession(s);return{session:n,user:await currentUser(n.access_token)}}catch{clearSession();return null}}}
async function login(email,password){const d=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});saveSession(d);return{session:d,user:d.user||await currentUser(d.access_token)}}
async function authed(path,opt={}){
 let s=getSession();if(!s)throw new Error('No hay sesión');
 const headers=Object.assign({Authorization:'Bearer '+s.access_token},opt.headers||{});
 try{return await request(path,Object.assign({},opt,{headers}))}
 catch(e){if(!s.refresh_token)throw e;s=await refreshSession(s);return request(path,Object.assign({},opt,{headers:Object.assign({},headers,{Authorization:'Bearer '+s.access_token})}))}
}
const rest=(resource,query)=>authed('/rest/v1/'+resource+(query?'?'+query:''));
const rpc=(name,body)=>authed('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(body)});
async function insertTransaction(payload){return authed('/rest/v1/transactions',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)})}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function catByName(){
 const names=[...arguments].map(norm);
 return state.data.categories.find(c=>names.includes(norm(c.name)))||null;
}
function historicalSuggestion(text){
 const n=norm(text), tokens=n.split(' ').filter(x=>x.length>3&&!['euros','euro','para','desde','hasta'].includes(x));
 let best=null,bestScore=0;
 for(const t of state.data.transactions){
   const tc=norm(t.concept); if(!tc)continue;
   let score=0;
   for(const tok of tokens)if(tc.includes(tok))score+=2;
   if(n.includes(tc)||tc.includes(n))score+=4;
   if(score>bestScore&&t.category_id){best=t;bestScore=score}
 }
 return bestScore>=2?{tx:best,score:bestScore}:null;
}
function interpretNatural(raw){
 const text=String(raw||'').trim(), n=norm(text);
 const m=text.match(/(\d+(?:[.,]\d{1,2})?)/);
 const amount=m?Number(m[1].replace(',','.')):0;
 let concept=text.replace(m?.[0]||'',' ').replace(/\b(euros?|eur)\b/ig,' ').replace(/\s+/g,' ').trim();
 concept=concept.replace(/^[-–—,:;]+|[-–—,:;]+$/g,'').trim()||'Movimiento';
 let type='GASTO',cat=null,confidence=.72,reason='Regla general: se propone gasto y debes confirmarlo.';
 if(/transfer|traspas/.test(n)){type='TRANSFERENCIA_INTERNA';cat=catByName('Transferencia');confidence=.96;reason='Palabra de transferencia detectada.'}
 else if(/retirada.*invers|rescatar.*fondo|reintegro.*invers/.test(n)){type='RETIRADA_INVERSION';cat=catByName('Retirada inversión','Retirada inversion');confidence=.94;reason='Retirada de inversión detectada.'}
 else if(/devolu|reembolso/.test(n)){type='DEVOLUCION';cat=catByName('Devoluciones');confidence=.96;reason='Devolución o reembolso detectado.'}
 else if(/interes/.test(n)){type='INGRESO';cat=catByName('Intereses');confidence=.98;reason='Ingreso por intereses detectado.'}
 else if(/nomina|sueldo/.test(n)){type='INGRESO';cat=catByName('Nómina','Nomina');confidence=.98;reason='Nómina o sueldo detectado.'}
 else if(/clases|dar clase/.test(n)){type='INGRESO';cat=catByName('Clases');confidence=.96;reason='Ingreso por clases detectado.'}
 else if(/ingreso|cobro/.test(n)){type='INGRESO';cat=catByName('Otros ingresos');confidence=.86;reason='Palabra de ingreso o cobro detectada.'}
 else if(/invers|fondos? index|aportacion.*fondo|aportación.*fondo/.test(n)){type='INVERSION';cat=catByName('Inversión','Inversion');confidence=.94;reason='Aportación o inversión detectada.'}
 else {
   if(/mercadona|supermerc|fruter|alimentacion|alimentación/.test(n)){cat=catByName('Alimentación','Alimentacion');confidence=.96;reason='Comercio o palabra de alimentación reconocida.'}
   else if(/restaurante|hamburgues|montiz|comida fuera|cenar|cena /.test(n)){cat=catByName('Restaurantes');confidence=.9;reason='Restauración/comida fuera detectada.'}
   else if(/gimnasio|gym|deporte/.test(n)){cat=catByName('Deporte');confidence=.97;reason='Gimnasio o deporte reconocido.'}
   else if(/limpieza|jaidi|nuria/.test(n)){cat=catByName('Limpieza');confidence=.93;reason='Limpieza doméstica detectada.'}
   else if(/tesla|carga coche|garaje|gasolina|coche/.test(n)){cat=catByName('Coche');confidence=.9;reason='Gasto de coche reconocido.'}
   else if(/regalo|cumple/.test(n)){cat=catByName('Regalos');confidence=.9;reason='Regalo o cumpleaños detectado.'}
   else if(/miguel|juguete|pañal|nino|niño/.test(n)){cat=catByName('Niños','Ninos');confidence=.9;reason='Gasto asociado a niños reconocido.'}
   else if(/seguro/.test(n)){cat=catByName('Seguros');confidence=.9;reason='Seguro detectado.'}
   else if(/ibi|impuesto|tasa/.test(n)){cat=catByName('Impuestos');confidence=.91;reason='Impuesto o tasa detectado.'}
   else if(/alquiler|hipoteca|comunidad|derrrama|derram/.test(n)){cat=catByName('Vivienda');confidence=.88;reason='Coste del inmueble detectado.'}
   else if(/frigorifico|frigorífico|mueble|sofa|sofá|lavadora|hogar/.test(n)){cat=catByName('Hogar');confidence=.86;reason='Equipamiento o mantenimiento del hogar detectado.'}
   else {
     const hist=historicalSuggestion(concept);
     if(hist){cat=state.data.categories.find(c=>c.id===hist.tx.category_id)||null;confidence=.82;reason='Coincidencia con movimientos anteriores de vuestro hogar.'}
     else{cat=catByName('Otros gastos');confidence=.55;reason='No hay coincidencia suficiente; revisa la categoría.'}
   }
 }
 if(type==='INVERSION'&&!cat)cat=catByName('Inversión','Inversion');
 if(type==='RETIRADA_INVERSION'&&!cat)cat=catByName('Retirada inversión','Retirada inversion');
 if(type==='TRANSFERENCIA_INTERNA'&&!cat)cat=catByName('Transferencia');
 if(type==='DEVOLUCION'&&!cat)cat=catByName('Devoluciones');
 return {raw:text,amount,concept,type,category_id:cat?.id||'',confidence,reason,date:todayISO()};
}
function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function optionList(items,value,labelFn){return '<option value="">Seleccionar…</option>'+items.map(x=>'<option value="'+x.id+'" '+(x.id===value?'selected':'')+'>'+esc(labelFn(x))+'</option>').join('')}
function openRegister(){
 const back=document.createElement('div');back.className='modal-back';back.id='register-modal';
 back.innerHTML='<div class="modal"><div class="modal-head"><div><span class="eyebrow">Nuevo movimiento</span><h2>Escríbelo como quieras</h2></div><button class="close" id="close-modal">×</button></div><textarea class="quick-input" id="raw" placeholder="Ej.: 51 euros Mercadona"></textarea><div class="examples"><button class="example">51 Mercadona</button><button class="example">176 intereses Trade</button><button class="example">1000 fondos indexados</button><button class="example">150 devolución frigorífico</button></div><div class="modal-actions"><button class="btn" id="interpret">Interpretar</button></div><div id="preview"></div></div>';
 document.body.appendChild(back);
 const close=()=>back.remove();document.getElementById('close-modal').onclick=close;back.onclick=e=>{if(e.target===back)close()};
 back.querySelectorAll('.example').forEach(b=>b.onclick=()=>{document.getElementById('raw').value=b.textContent;showPreview(interpretNatural(b.textContent))});
 document.getElementById('interpret').onclick=()=>showPreview(interpretNatural(document.getElementById('raw').value));
 document.getElementById('raw').focus();
}
function showPreview(d){
 state.draft=d;const host=document.getElementById('preview');
 if(!d.raw){host.innerHTML='<div class="notice">Escribe primero el movimiento.</div>';return}
 const last=localStorage.getItem('ff_last_account_v1')||'';
 const cats=optionList(state.data.categories,d.category_id,c=>c.name),acc=optionList(state.data.accounts,last,a=>a.name+' · '+money(a.current_balance)),inv=optionList(state.data.investments,'',i=>i.name);
 host.innerHTML='<div class="preview-card"><div class="preview-top"><strong>Revisa antes de guardar</strong><span class="confidence">'+Math.round(d.confidence*100)+' % confianza</span></div><div class="edit-grid"><label>Importe<input id="f-amount" inputmode="decimal" value="'+esc(d.amount||'')+'"></label><label>Fecha<input id="f-date" type="date" value="'+esc(d.date)+'"></label><label class="wide">Concepto<input id="f-concept" value="'+esc(d.concept)+'"></label><label>Tipo<select id="f-type"><option>GASTO</option><option>INGRESO</option><option>INVERSION</option><option>RETIRADA_INVERSION</option><option>TRANSFERENCIA_INTERNA</option><option>DEVOLUCION</option></select></label><label>Categoría<select id="f-category">'+cats+'</select></label><label>Cuenta<select id="f-account">'+acc+'</select></label><label id="dest-wrap" style="display:none">Cuenta destino<select id="f-dest">'+optionList(state.data.accounts,'',a=>a.name)+'</select></label><label id="inv-wrap" style="display:none">Inversión<select id="f-investment">'+inv+'</select></label><label>Persona<input id="f-person" value="'+esc(state.member?.display_name||'')+'"></label></div><div class="preview-reason">'+esc(d.reason)+' El movimiento no se guardará hasta que pulses Confirmar.</div><div id="form-error" class="status err" style="display:none"></div><div class="modal-actions"><button class="btn" id="cancel-preview">Cancelar</button><button class="save" id="save-tx">Confirmar y guardar</button></div></div>';
 document.getElementById('f-type').value=d.type;
 const sync=()=>{const t=document.getElementById('f-type').value;document.getElementById('dest-wrap').style.display=t==='TRANSFERENCIA_INTERNA'?'grid':'none';document.getElementById('inv-wrap').style.display=(t==='INVERSION'||t==='RETIRADA_INVERSION')?'grid':'none'};
 document.getElementById('f-type').onchange=sync;sync();
 document.getElementById('cancel-preview').onclick=()=>host.innerHTML='';
 document.getElementById('save-tx').onclick=savePreview;
}
async function savePreview(){
 const err=document.getElementById('form-error'),btn=document.getElementById('save-tx');
 const amount=Number(String(document.getElementById('f-amount').value).replace(',','.')),date=document.getElementById('f-date').value,concept=document.getElementById('f-concept').value.trim(),type=document.getElementById('f-type').value,category=document.getElementById('f-category').value,account=document.getElementById('f-account').value,dest=document.getElementById('f-dest').value,investment=document.getElementById('f-investment').value,person=document.getElementById('f-person').value.trim();
 const fail=m=>{err.textContent=m;err.style.display='block';return};
 if(!(amount>0))return fail('El importe debe ser mayor que cero.');
 if(!date||!concept)return fail('Fecha y concepto son obligatorios.');
 if(!account)return fail('Selecciona la cuenta afectada. Así la caja y los saldos seguirán cuadrando.');
 if(type==='TRANSFERENCIA_INTERNA'&&(!dest||dest===account))return fail('La transferencia necesita una cuenta destino distinta.');
 if((type==='INVERSION'||type==='RETIRADA_INVERSION')&&!investment)return fail('Selecciona la inversión asociada.');
 err.style.display='none';btn.disabled=true;btn.textContent='Guardando…';
 const external='staging:'+crypto.randomUUID();
 const payload={household_id:state.household.id,transaction_date:date,amount,concept,type,category_id:category||null,person_user_id:person===state.member?.display_name?state.user.id:null,person_label:person||null,account_id:account,destination_account_id:type==='TRANSFERENCIA_INTERNA'?dest:null,investment_id:(type==='INVERSION'||type==='RETIRADA_INVERSION')?investment:null,created_by:state.user.id,source:'MANUAL',external_id:external,notes:'Alta desde GitHub staging',raw_input:state.draft?.raw||null,classification_confidence:state.draft?.confidence||null,classification_reason:state.draft?.reason||null,classification_confirmed:true};
 try{await insertTransaction(payload);localStorage.setItem('ff_last_account_v1',account);document.getElementById('register-modal')?.remove();toast('Movimiento guardado correctamente');await loadAll();location.hash='movimientos';renderApp()}
 catch(e){btn.disabled=false;btn.textContent='Confirmar y guardar';fail(e.message)}
}
function localMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'}
function monthName(iso){const [y,m]=iso.slice(0,7).split('-').map(Number);return monthFmt.format(new Date(y,m-1,1))}
function monthRange(){const d=new Date(),y=d.getFullYear(),m=d.getMonth();return{from:y+'-'+String(m+1).padStart(2,'0')+'-01',to:y+'-'+String(m+1).padStart(2,'0')+'-'+String(new Date(y,m+1,0).getDate()).padStart(2,'0')}}
function typeMeta(t){if(t==='INGRESO')return{icon:'+',cls:'in',sign:'+'};if(t==='DEVOLUCION')return{icon:'↩',cls:'in',sign:'+'};if(t==='RETIRADA_INVERSION')return{icon:'↙',cls:'in',sign:'+'};if(t==='GASTO')return{icon:'−',cls:'out',sign:'−'};if(t==='INVERSION')return{icon:'↗',cls:'out',sign:'−'};return{icon:'↔',cls:'neutral',sign:''}}
function renderLogin(msg){
 root.innerHTML='<div class="login"><main class="login-card"><div class="logo">F</div><h1>Finanzas Familiares</h1><p>Acceso privado al hogar compartido.</p><label class="field">Email<input id="email" type="email" autocomplete="email"></label><label class="field">Contraseña<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="login">Entrar</button><div class="status" id="status">'+esc(msg||'La sesión se guardará en este dispositivo.')+'</div></main></div>';
 document.getElementById('login').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,st=document.getElementById('status');if(!email||!password){st.textContent='Introduce email y contraseña.';st.className='status err';return}st.textContent='Entrando…';try{const a=await login(email,password);state.user=a.user;await loadAll();renderApp()}catch(e){st.textContent=e.message;st.className='status err'}};
}
async function loadAll(){
 root.innerHTML='<div class="loading"><div><div class="logo" style="margin:auto">F</div><p>Leyendo tus finanzas…</p></div></div>';
 const members=await rest('household_members','user_id=eq.'+encodeURIComponent(state.user.id)+'&select=household_id,role,display_name&limit=1');
 if(!members?.length)throw new Error('Tu usuario no está vinculado a ningún hogar.');
 state.member=members[0];const h=members[0].household_id;const mr=monthRange(),month=localMonth();
 const households=await rest('households','id=eq.'+h+'&select=id,name&limit=1');state.household=households?.[0]||{id:h,name:'Familia'};
 const result=await Promise.all([
   rpc('monthly_metrics',{p_household:h,p_month:month}),
   rpc('net_worth_summary',{p_household:h}),
   rpc('monthly_financial_trend',{p_household:h,p_months:12}),
   rpc('expense_category_breakdown',{p_household:h,p_from:mr.from,p_to:mr.to}),
   rest('categories','household_id=eq.'+h+'&select=id,name,kind&order=sort_order.asc'),
   rest('transactions','household_id=eq.'+h+'&select=id,transaction_date,amount,type,concept,category_id,person_label&order=transaction_date.desc,created_at.desc&limit=120'),
   rest('account_balances_current','household_id=eq.'+h+'&select=id,name,type,currency,current_balance,include_in_cash,include_in_net_worth&order=name.asc'),
   rest('investment_values_current','household_id=eq.'+h+'&select=id,name,provider,asset_type,currency,current_value,valuation_date&order=name.asc'),
   rest('assets','household_id=eq.'+h+'&is_archived=eq.false&select=id,name,type,current_value,valuation_date&order=name.asc'),
   rest('liabilities','household_id=eq.'+h+'&is_archived=eq.false&select=id,name,type,lender,outstanding_balance,monthly_payment&order=name.asc'),
   rest('household_members','household_id=eq.'+h+'&select=user_id,role,display_name,joined_at&order=joined_at.asc')
 ]);
 state.data={metrics:result[0]?.[0]||{},networth:result[1]?.[0]||{},trend:result[2]||[],breakdown:result[3]||[],categories:result[4]||[],transactions:result[5]||[],accounts:result[6]||[],investments:result[7]||[],assets:result[8]||[],liabilities:result[9]||[],members:result[10]||[]};
}
function navButton(id,label,icon){return '<button data-view="'+id+'" class="'+(currentView()===id?'active':'')+'"><span class="ni">'+icon+'</span>'+label+'</button>'}
function currentView(){const x=(location.hash||'#inicio').slice(1);return['inicio','movimientos','analisis','patrimonio','ajustes'].includes(x)?x:'inicio'}
function shell(content){
 const initials=(state.member?.display_name||state.user.email||'F').slice(0,1).toUpperCase();
 root.innerHTML='<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">F</div><div class="brand-copy"><b>Finanzas</b><small>'+esc(state.household.name)+'</small></div></div><nav class="nav">'+navButton('inicio','Inicio','⌂')+navButton('movimientos','Movimientos','⇄')+navButton('analisis','Análisis','◔')+navButton('patrimonio','Patrimonio','▥')+navButton('ajustes','Ajustes','⚙')+'</nav><div class="side-foot"><div class="user"><div class="avatar">'+initials+'</div><div class="user-copy"><b>'+esc(state.member?.display_name||'Usuario')+'</b><small>'+esc(state.user.email||'')+'</small></div></div></div></aside>'+
 '<main class="main"><div class="mobile-top"><div class="brand"><div class="logo">F</div><div class="brand-copy"><b>Finanzas</b><small>'+esc(state.household.name)+'</small></div></div><span class="stg">STAGING</span></div>'+content+'</main>'+
 '<nav class="bottom-nav">'+[['inicio','⌂','Inicio'],['movimientos','⇄','Movim.'],['analisis','◔','Análisis'],['patrimonio','▥','Patrim.'],['ajustes','⚙','Ajustes']].map(([id,ic,l])=>'<button data-view="'+id+'" class="'+(currentView()===id?'active':'')+'"><b>'+ic+'</b><span>'+l+'</span></button>').join('')+'</nav><button class="fab" title="Registrar movimiento">+</button></div>';
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.view});
}
function txRows(list){
 const cm=Object.fromEntries(state.data.categories.map(c=>[c.id,c.name]));
 return (list||[]).map(t=>{const meta=typeMeta(t.type),d=new Date(t.transaction_date+'T12:00:00'),cat=cm[t.category_id]||'Sin categoría';return '<div class="tx"><div class="ico '+meta.cls+'">'+meta.icon+'</div><div class="tx-main"><b>'+esc(t.concept)+'</b><span>'+esc(cat)+' · '+esc(t.person_label||'Familia')+' · '+dateFmt.format(d)+'</span></div><div class="amt '+(meta.cls==='in'?'green':meta.cls==='out'?'red':'blue')+'">'+meta.sign+money(t.amount)+'</div></div>'}).join('')||'<div class="empty">No hay movimientos.</div>'
}
function head(ey,title,desc){return '<header class="page-head"><div><span class="eyebrow">'+ey+'</span><h1>'+title+'</h1><p>'+desc+'</p></div><div class="actions"><span class="stg">STAGING</span><button class="btn" id="new-tx">+ Registrar</button><button class="btn" id="refresh">Actualizar</button></div></header>'}
function bindCommon(){const r=document.getElementById('refresh');if(r)r.onclick=async()=>{await loadAll();renderApp()};const n=document.getElementById('new-tx');if(n)n.onclick=openRegister;const f=document.querySelector('.fab');if(f)f.onclick=openRegister}
function viewInicio(){
 const m=state.data.metrics,n=state.data.networth,cashOut=Number(m.expenses||0)+Number(m.invested||0);
 shell(head('Resumen del mes','Inicio','Una vista rápida de caja, coste y patrimonio.')+
 '<section class="metrics"><div class="metric"><span>Ingresos</span><strong class="green">'+money(m.income)+'</strong><small>Caja cobrada</small></div><div class="metric"><span>Gastos reales</span><strong class="red">'+money(m.expenses)+'</strong><small>Consumo pagado</small></div><div class="metric"><span>Salidas de caja</span><strong class="orange">'+money(cashOut)+'</strong><small>Gasto + inversión</small></div><div class="metric"><span>Coste normalizado</span><strong>'+money(m.normalized_cost)+'</strong><small>Coste económico</small></div><div class="metric"><span>Ahorro operativo</span><strong class="'+(Number(m.operating_savings)>=0?'green':'red')+'">'+money(m.operating_savings)+'</strong><small>Ingresos + devoluciones − gastos</small></div><div class="metric"><span>Inversión</span><strong class="purple">'+money(m.invested)+'</strong><small>No es gasto</small></div><div class="metric"><span>Devoluciones</span><strong class="blue">'+money(m.refunds)+'</strong><small>Reduce gasto</small></div><div class="metric"><span>Patrimonio neto</span><strong>'+money(n.net_worth)+'</strong><small>Activos − deudas</small></div></section>'+
 '<section class="grid"><div class="panel"><div class="panel-head"><div><span class="sub">Actividad</span><h2>Últimos movimientos</h2></div><button class="btn" data-go="movimientos">Ver todos</button></div>'+txRows(state.data.transactions.slice(0,8))+'</div><div class="panel"><div class="panel-head"><div><span class="sub">Caja</span><h2>Cuentas</h2></div></div>'+state.data.accounts.map(a=>'<div class="item"><div><strong>'+esc(a.name)+'</strong><br><span>'+esc(a.type)+'</span></div><strong>'+money(a.current_balance)+'</strong></div>').join('')+'</div></section>');
 bindCommon();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash=b.dataset.go)
}
function viewMovimientos(){
 shell(head('Histórico','Movimientos','Consulta y filtra todos los movimientos cargados.')+
 '<section class="panel"><div class="filters"><input id="q" placeholder="Buscar concepto o categoría"><select id="type"><option value="">Todos los tipos</option><option>GASTO</option><option>INGRESO</option><option>INVERSION</option><option>RETIRADA_INVERSION</option><option>TRANSFERENCIA_INTERNA</option><option>DEVOLUCION</option></select><select id="limit"><option value="30">Últimos 30</option><option value="60">Últimos 60</option><option value="120">Últimos 120</option></select></div><div id="txlist"></div></section>');
 bindCommon();const q=document.getElementById('q'),type=document.getElementById('type'),limit=document.getElementById('limit'),cm=Object.fromEntries(state.data.categories.map(c=>[c.id,c.name]));
 function draw(){const term=q.value.trim().toLowerCase(),tp=type.value,n=Number(limit.value);const list=state.data.transactions.filter(t=>(!tp||t.type===tp)&&(!term||(t.concept||'').toLowerCase().includes(term)||(cm[t.category_id]||'').toLowerCase().includes(term))).slice(0,n);document.getElementById('txlist').innerHTML=txRows(list)}
 q.oninput=draw;type.onchange=draw;limit.onchange=draw;draw()
}
function viewAnalisis(){
 const b=state.data.breakdown,t=state.data.trend,max=Math.max(1,...b.map(x=>Number(x.amount||0)));
 shell(head('Evolución','Análisis','Tendencias mensuales y composición del gasto.')+
 '<section class="grid"><div class="panel"><div class="panel-head"><div><span class="sub">12 meses</span><h2>Evolución financiera</h2></div></div><div style="overflow:auto"><table class="trend"><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Inversión</th><th>Ahorro</th><th>Normalizado</th></tr></thead><tbody>'+t.map(r=>'<tr><td>'+esc(monthName(r.month))+'</td><td class="green">'+money(r.income)+'</td><td class="red">'+money(r.expenses)+'</td><td class="purple">'+money(r.invested)+'</td><td>'+money(r.operating_savings)+'</td><td>'+money(r.normalized_cost)+'</td></tr>').join('')+'</tbody></table></div></div>'+
 '<div class="panel"><div class="panel-head"><div><span class="sub">Mes actual</span><h2>Gasto por categoría</h2></div></div><div class="bars">'+(b.length?b.map(x=>'<div><div class="bar-head"><span>'+esc(x.category_name)+'</span><strong>'+money(x.amount)+'</strong></div><div class="track"><i style="width:'+Math.max(2,Math.round(Number(x.amount||0)/max*100))+'%"></i></div></div>').join(''):'<div class="empty">Sin gasto categorizado.</div>')+'</div></div></section>');
 bindCommon()
}
function viewPatrimonio(){
 const n=state.data.networth;
 const entity=(title,sub,val,cls='')=>'<div class="entity-card"><span class="sub">'+esc(sub)+'</span><h3>'+esc(title)+'</h3><div class="value '+cls+'">'+money(val)+'</div></div>';
 shell(head('Activos y deudas','Patrimonio','Cuentas, inversiones, bienes y deuda pendiente.')+
 '<section class="metrics"><div class="metric"><span>Cuentas</span><strong>'+money(n.cash_accounts)+'</strong></div><div class="metric"><span>Inversiones</span><strong class="purple">'+money(n.investments)+'</strong></div><div class="metric"><span>Otros activos</span><strong>'+money(n.other_assets)+'</strong></div><div class="metric"><span>Deudas</span><strong class="red">−'+money(n.liabilities)+'</strong></div></section>'+
 '<section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><span class="sub">Total</span><h2>Patrimonio neto</h2></div><strong style="font-size:28px">'+money(n.net_worth)+'</strong></div></section>'+
 '<section class="grid equal"><div class="panel"><div class="panel-head"><div><span class="sub">Liquidez</span><h2>Cuentas</h2></div></div>'+state.data.accounts.map(a=>'<div class="item"><div><strong>'+esc(a.name)+'</strong><br><span>'+esc(a.type)+'</span></div><strong>'+money(a.current_balance)+'</strong></div>').join('')+'</div><div class="panel"><div class="panel-head"><div><span class="sub">Carteras</span><h2>Inversiones</h2></div></div>'+state.data.investments.map(i=>'<div class="item"><div><strong>'+esc(i.name)+'</strong><br><span>'+esc(i.provider||i.asset_type||'Inversión')+'</span></div><strong>'+money(i.current_value)+'</strong></div>').join('')+'</div></section>'+
 '<section class="cards">'+state.data.assets.map(a=>entity(a.name,a.type,a.current_value)).concat(state.data.liabilities.map(l=>entity(l.name,l.type,l.outstanding_balance,'red'))).join('')+'</section>');
 bindCommon()
}
function viewAjustes(){
 shell(head('Hogar y aplicación','Ajustes','Miembros, sesión y estado de esta versión.')+
 '<section class="grid equal"><div class="panel"><div class="panel-head"><div><span class="sub">Familia</span><h2>Miembros del hogar</h2></div></div>'+state.data.members.map(m=>'<div class="item"><div><strong>'+esc(m.display_name||'Miembro')+'</strong><br><span>'+esc(m.role)+'</span></div><span>'+new Date(m.joined_at).toLocaleDateString('es-ES')+'</span></div>').join('')+'</div>'+
 '<div class="panel"><div class="panel-head"><div><span class="sub">Aplicación</span><h2>Estado</h2></div></div><div class="settings-list"><div class="setting"><b>Sesión persistente</b><span>Activada en este dispositivo y validada.</span></div><div class="setting"><b>Backend</b><span>Supabase · hogar protegido por RLS.</span></div><div class="setting"><b>Hosting</b><span>GitHub Pages.</span></div><div class="setting"><b>Modo de pruebas</b><span>Lectura activada. Escrituras todavía bloqueadas hasta la siguiente fase.</span></div></div><button class="btn" id="logout" style="margin-top:12px">Cerrar sesión</button></div></section>');
 bindCommon();document.getElementById('logout').onclick=async()=>{const s=getSession();try{if(s?.access_token)await request('/auth/v1/logout',{method:'POST',headers:{Authorization:'Bearer '+s.access_token}})}catch(e){}clearSession();state.user=null;renderLogin('Sesión cerrada en este dispositivo.')}
}
function renderApp(){const v=currentView();if(v==='movimientos')viewMovimientos();else if(v==='analisis')viewAnalisis();else if(v==='patrimonio')viewPatrimonio();else if(v==='ajustes')viewAjustes();else viewInicio()}
window.addEventListener('hashchange',()=>{if(state.data)renderApp()});
(async()=>{try{const a=await restore();if(!a)return renderLogin();state.user=a.user;await loadAll();renderApp()}catch(e){renderLogin('No se pudo cargar la app: '+e.message)}})();
})();
</script>
