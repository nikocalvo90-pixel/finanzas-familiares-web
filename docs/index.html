<script>
(function(){
const SUPA='https://lqsoxkoiwczouhvefmgg.supabase.co';
const KEY=['sb_publishable_ctmNZLxW2y5f_','7CJJ8FDMw_xyRqnRT_'].join('');
const STORE='ff_session_github_staging_v1';
const PENDING_JOIN='ff_pending_join_v1';
const root=document.getElementById('root');
const eur=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2});
const monthFmt=new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'});
const dateFmt=new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const state={user:null,household:null,member:null,data:null,draft:null,syncSignature:null,syncTimer:null,syncBusy:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>eur.format(Number(v||0));
const getSession=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}};
const saveSession=s=>localStorage.setItem(STORE,JSON.stringify(s));
const clearSession=()=>localStorage.removeItem(STORE);
const getPendingJoin=()=>{try{return JSON.parse(localStorage.getItem(PENDING_JOIN)||'null')}catch{return null}};
const setPendingJoin=v=>localStorage.setItem(PENDING_JOIN,JSON.stringify(v));
const clearPendingJoin=()=>localStorage.removeItem(PENDING_JOIN);
function rememberInviteFromUrl(){
 const code=new URL(location.href).searchParams.get('invite');
 if(code){
   const p=getPendingJoin()||{};
   setPendingJoin({code:String(code).trim().toUpperCase(),displayName:p.displayName||''});
 }
}
function consumeAuthRedirect(){
 const p=new URLSearchParams((location.hash||'').replace(/^#/,''));
 const error=p.get('error_description')||p.get('error');
 const access=p.get('access_token'),refresh=p.get('refresh_token');
 if(access&&refresh){
   const expiresIn=Number(p.get('expires_in')||3600);
   saveSession({access_token:access,refresh_token:refresh,token_type:p.get('token_type')||'bearer',expires_in:expiresIn,expires_at:Math.floor(Date.now()/1000)+expiresIn});
   history.replaceState(null,'',location.pathname+location.search);
   return {restored:true,error:null};
 }
 return {restored:false,error:error?decodeURIComponent(error.replace(/\+/g,' ')):null};
}
async function request(path,opt={}){
 const headers=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});
 const r=await fetch(SUPA+path,Object.assign({},opt,{headers}));
 const t=await r.text(); let d=null; try{d=t?JSON.parse(t):null}catch{d=t}
 if(!r.ok) throw new Error((d&&((d.message)||(d.msg)||(d.error_description)))||('HTTP '+r.status));
 return d;
}
async function currentUser(token){return request('/auth/v1/user',{headers:{Authorization:'Bearer '+token}})}
async function refreshSession(s){const d=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh_token})});saveSession(d);return d}
async function restore(){const s=getSession();if(!s)return null;try{return{session:s,user:await currentUser(s.access_token)}}catch(e){try{const n=await refreshSession(s);return{session:n,user:await currentUser(n.access_token)}}catch{clearSession();return null}}}
async function login(email,password){const d=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});saveSession(d);return{session:d,user:d.user||await currentUser(d.access_token)}}
async function signup(email,password,displayName,inviteCode){
 const redirect=new URL(location.origin+location.pathname);
 if(inviteCode)redirect.searchParams.set('invite',inviteCode);
 const d=await request('/auth/v1/signup?redirect_to='+encodeURIComponent(redirect.toString()),{method:'POST',body:JSON.stringify({email,password,data:{display_name:displayName}})});
 if(d&&d.access_token){
   saveSession(d);
   return {session:d,user:d.user||await currentUser(d.access_token),needsConfirmation:false};
 }
 return {session:null,user:d&&d.user?d.user:null,needsConfirmation:true};
}
async function authed(path,opt={}){

async function restAll(resource,query){
 const pageSize=1000,all=[];let offset=0;
 while(true){
   const q=(query?query+'&':'')+'limit='+pageSize+'&offset='+offset;
   const page=await rest(resource,q);
   if(!Array.isArray(page))return page;

   offset+=pageSize;
 }
 return all;
}

function historicalSuggestion(text){
 const n=norm(text), tokens=n.split(' ').filter(x=>x.length>3&&!['euros','euro','para','desde','hasta','prueba'].includes(x));
 const exact=state.data.transactions.find(t=>t.category_id&&norm(t.concept)===n);
 if(exact)return {category_id:exact.category_id,confidence:.97,reason:'Coincidencia exacta con vuestro histórico.'};
 const scores=new Map();
 for(let i=0;i<state.data.transactions.length;i++){
   const t=state.data.transactions[i],tc=norm(t.concept);if(!tc||!t.category_id)continue;
   let score=0;
   for(const tok of tokens){
     if(tc===tok)score+=5;
     else if(tc.includes(tok))score+=2;
   }
   if(tokens.length&&tokens.every(tok=>tc.includes(tok)))score+=5;
   if(n.includes(tc)||tc.includes(n))score+=4;
   if(!score)continue;
   const row=scores.get(t.category_id)||{score:0,hits:0,last:i};
   row.score+=score;row.hits+=1;row.last=Math.min(row.last,i);scores.set(t.category_id,row);
 }
 const ranked=[...scores.entries()].sort((a,b)=>b[1].score-a[1].score||b[1].hits-a[1].hits||a[1].last-b[1].last);
 if(!ranked.length)return null;
 const [category_id,best]=ranked[0], second=ranked[1]?.[1]?.score||0;
 if(best.score<3)return null;
 const gap=best.score-second;
 const confidence=Math.min(.94,.70+Math.min(.16,best.hits*.03)+Math.min(.08,gap*.02));
 return {category_id,confidence,reason:best.hits>1?'Patrón repetido en vuestro histórico ('+best.hits+' coincidencias).':'Coincidencia con vuestro histórico.'};
}
function interpretNatural(raw){
 const text=String(raw||'').trim(), n=norm(text);
 const m=text.match(/(\d+(?:[.,]\d{1,2})?)/);
 const amount=m?Number(m[1].replace(',','.')):0;
 let concept=text.replace(m?.[0]||'',' ').replace(/\b(euros?|eur)\b/ig,' ').replace(/\s+/g,' ').trim();
 concept=concept.replace(/^[-–—,:;]+|[-–—,:;]+$/g,'').trim()||'Movimiento';
 let type='GASTO',cat=null,confidence=.72,reason='Regla general: se propone gasto y debes confirmarlo.';
 if(/transfer|traspas/.test(n)){type='TRANSFERENCIA_INTERNA';cat=catByName('Transferencia');confidence=.96;reason='Palabra de transferencia detectada.'}
 else if(/retirada.*invers|rescatar.*fondo|reintegro.*invers/.test(n)){type='RETIRADA_INVERSION';cat=catByName('Retirada inversión','Retirada inversion');confidence=.94;reason='Retirada de inversión detectada.'}
 else if(/devolu|reembolso/.test(n)){type='DEVOLUCION';cat=catByName('Devoluciones');confidence=.96;reason='Devolución o reembolso detectado.'}
 else if(/interes/.test(n)){type='INGRESO';cat=catByName('Intereses');confidence=.98;reason='Ingreso por intereses detectado.'}
 else if(/nomina|sueldo/.test(n)){type='INGRESO';cat=catByName('Nómina','Nomina');confidence=.98;reason='Nómina o sueldo detectado.'}
 else if(/clases|dar clase/.test(n)){type='INGRESO';cat=catByName('Clases');confidence=.96;reason='Ingreso por clases detectado.'}
 else if(/ingreso|cobro/.test(n)){type='INGRESO';cat=catByName('Otros ingresos');confidence=.86;reason='Palabra de ingreso o cobro detectada.'}
 else if(/invers|fondos? index|aportacion.*fondo|aportación.*fondo/.test(n)){type='INVERSION';cat=catByName('Inversión','Inversion');confidence=.94;reason='Aportación o inversión detectada.'}
 else {
   if(/mercadona|supermerc|fruter|alimentacion|alimentación/.test(n)){cat=catByName('Alimentación','Alimentacion');confidence=.96;reason='Comercio o palabra de alimentación reconocida.'}
   else if(/restaurante|hamburgues|montiz|comida fuera|cenar|cena /.test(n)){cat=catByName('Restaurantes');confidence=.9;reason='Restauración/comida fuera detectada.'}
   else if(/gimnasio|gym|deporte/.test(n)){cat=catByName('Deporte');confidence=.97;reason='Gimnasio o deporte reconocido.'}
   else if(/limpieza|jaidi|nuria/.test(n)){cat=catByName('Limpieza');confidence=.93;reason='Limpieza doméstica detectada.'}
   else if(/tesla|carga coche|garaje|gasolina|coche/.test(n)){cat=catByName('Coche');confidence=.9;reason='Gasto de coche reconocido.'}
   else if(/regalo|cumple/.test(n)){cat=catByName('Regalos');confidence=.9;reason='Regalo o cumpleaños detectado.'}
   else if(/miguel|juguete|pañal|nino|niño/.test(n)){cat=catByName('Niños','Ninos');confidence=.9;reason='Gasto asociado a niños reconocido.'}
   else if(/seguro/.test(n)){cat=catByName('Seguros');confidence=.9;reason='Seguro detectado.'}
   else if(/ibi|impuesto|tasa/.test(n)){cat=catByName('Impuestos');confidence=.91;reason='Impuesto o tasa detectado.'}
   else if(/alquiler|hipoteca|comunidad|derrrama|derram/.test(n)){cat=catByName('Vivienda');confidence=.88;reason='Coste del inmueble detectado.'}
   else if(/frigorifico|frigorífico|mueble|sofa|sofá|lavadora|hogar/.test(n)){cat=catByName('Hogar');confidence=.86;reason='Equipamiento o mantenimiento del hogar detectado.'}
   else if(/farmacia|medicamento|medico|médico|dentista|salud/.test(n)){cat=catByName('Salud');confidence=.9;reason='Salud o farmacia detectada.'}
   else if(/luz|electricidad|agua|gas natural|fibra|internet|telefono|teléfono/.test(n)){cat=catByName('Suministros');confidence=.88;reason='Suministro doméstico detectado.'}
   else if(/spotify|netflix|icloud|suscripcion|suscripción/.test(n)){cat=catByName('Suscripciones');confidence=.88;reason='Suscripción detectada.'}
   else if(/hotel|vuelo|avion|avión|viaje/.test(n)){cat=catByName('Viajes');confidence=.88;reason='Viaje detectado.'}
   else if(/colegio|guarderia|guardería|curso|matricula|matrícula/.test(n)){cat=catByName('Educación','Educacion');confidence=.87;reason='Educación detectada.'}
   else {
     const hist=historicalSuggestion(concept);
     if(hist){cat=state.data.categories.find(c=>c.id===hist.category_id)||null;confidence=hist.confidence;reason=hist.reason}
     else{cat=catByName('Otros gastos');confidence=.55;reason='No hay coincidencia suficiente; revisa la categoría.'}
   }
 }
 if(type==='INVERSION'&&!cat)cat=catByName('Inversión','Inversion');
 if(type==='RETIRADA_INVERSION'&&!cat)cat=catByName('Retirada inversión','Retirada inversion');
 if(type==='TRANSFERENCIA_INTERNA'&&!cat)cat=catByName('Transferencia');
 if(type==='DEVOLUCION'&&!cat)cat=catByName('Devoluciones');
 return {raw:text,amount,concept,type,category_id:cat?.id||'',confidence,reason,date:todayISO()};
}

 const assetMap=Object.fromEntries(assets.map(a=>[a.id,a.name]));assetVals.forEach(v=>vals.push(['Activo',assetMap[v.asset_id]||'',v.valuation_date,C(v.value),v.notes||'']));
 const liabMap=Object.fromEntries(liabs.map(a=>[a.id,a.name]));liabVals.forEach(v=>vals.push(['Deuda',liabMap[v.liability_id]||'',v.snapshot_date,C(v.outstanding_balance),v.notes||'']));
 return {'Movimientos':mov,'Resumen mensual':summary,'Categorías':catsSheet,'Cuentas':accSheet,'Inversiones':invSheet,'Patrimonio':patr,'Periodizaciones':per,'Cierres':cls,'Valoraciones':vals};
}
async function exportWorkbook(){
 try{
   const sheets=await buildWorkbookSheets(),blob=buildXlsx(sheets),name='Finanzas_Familia_'+todayISO()+'.xlsx',file=new File([blob],name,{type:blob.type});
   if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Finanzas Familiares'})}
   else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
   toast('Excel acumulativo preparado');
 }catch(e){alert('No se pudo generar el Excel: '+e.message)}
}
function openMonthClose(){
 const back=document.createElement('div');back.className='modal-back';back.id='close-month-modal';
 back.innerHTML='<div class="modal"><div class="modal-head"><div><span class="eyebrow">Control mensual</span><h2>Cierre de mes</h2></div><button class="close" id="close-month-x">×</button></div><div class="close-tools"><input class="month-input" id="close-month-input" type="month" value="'+previousMonthKey()+'"><button class="btn" id="review-month">Revisar mes</button><button class="btn" id="export-now">Excel acumulativo</button></div><div id="close-month-body"><div class="empty">Selecciona un mes para revisar duplicados, métricas y estado del cierre.</div></div></div>';
 document.body.appendChild(back);const close=()=>back.remove();document.getElementById('close-month-x').onclick=close;back.onclick=e=>{if(e.target===back)close()};document.getElementById('review-month').onclick=reviewMonthClose;document.getElementById('export-now').onclick=exportWorkbook;reviewMonthClose();
}
async function reviewMonthClose(){
 const key=document.getElementById('close-month-input')?.value,body=document.getElementById('close-month-body');if(!key||!body)return;
 body.innerHTML='<div class="loading" style="min-height:180px"><div><p>Revisando '+esc(key)+'…</p></div></div>';
 try{
   const month=key+'-01',h=state.household.id;
   const [mr,dups,closures]=await Promise.all([rpc('monthly_metrics',{p_household:h,p_month:month}),rpc('month_duplicate_candidates',{p_household:h,p_month:month}),rest('monthly_closures','household_id=eq.'+h+'&month=eq.'+month+'&select=*&limit=1')]);
   const m=mr?.[0]||{},closure=closures?.[0]||null;state.closureReview={key,m,dups:dups||[],closure};
   const dhtml=(dups||[]).length?(dups||[]).map(d=>'<div class="dup-row"><b>'+esc(d.first_concept)+' ↔ '+esc(d.second_concept)+'</b><span>'+esc(d.transaction_date)+' · '+money(d.amount)+' · similitud '+Math.round(Number(d.similarity_score||0)*100)+'%</span></div>').join(''):'<div class="notice"><strong>Sin duplicados probables.</strong> La revisión automática no ha encontrado pares sospechosos.</div>';
   const status=closure?.status==='CLOSED'?'<span class="chip-closed">CERRADO</span>':closure?.status==='REOPENED'?'<span class="chip-warn">REABIERTO</span>':'<span class="chip-ok">ABIERTO</span>';
   const owner=state.member?.role==='OWNER',closable=canCloseMonth(key);
   body.innerHTML='<div class="close-panel"><div class="panel-head"><div><span class="sub">Estado</span><h2>'+esc(monthName(month))+'</h2></div>'+status+'</div>'+
   '<div class="close-summary"><div class="close-kpi"><span>Ingresos</span><strong class="green">'+money(m.income)+'</strong></div><div class="close-kpi"><span>Gastos</span><strong class="red">'+money(m.expenses)+'</strong></div><div class="close-kpi"><span>Inversión</span><strong class="purple">'+money(m.invested)+'</strong></div><div class="close-kpi"><span>Normalizado</span><strong>'+money(m.normalized_cost)+'</strong></div></div>'+
   '<div class="section-title"><h2>Revisión de duplicados</h2><span class="'+((dups||[]).length?'chip-warn':'chip-ok')+'">'+(dups||[]).length+' candidatos</span></div>'+dhtml+
   ((dups||[]).length?'<label class="checkline"><input type="checkbox" id="duplicates-reviewed"><span>He revisado estos candidatos y confirmo que el mes está listo para cierre.</span></label>':'')+
   (!closable&&closure?.status!=='CLOSED'?'<div class="notice"><strong>Mes en curso.</strong> Puedes revisarlo y exportarlo, pero el cierre definitivo se habilita al terminar el mes.</div>':'')+
   '<div class="modal-actions">'+(closure?.status==='CLOSED'?(owner?'<button class="btn" id="reopen-month">Reabrir mes</button>':''):(owner&&closable?'<button class="save" id="confirm-close-month">Cerrar mes y generar Excel</button>':''))+'<button class="btn" id="close-export">Exportar Excel</button></div></div>';
   const ex=document.getElementById('close-export');if(ex)ex.onclick=exportWorkbook;
   const cl=document.getElementById('confirm-close-month');if(cl)cl.onclick=closeReviewedMonth;
   const ro=document.getElementById('reopen-month');if(ro)ro.onclick=reopenReviewedMonth;
 }catch(e){body.innerHTML='<div class="status err">'+esc(e.message)+'</div>'}
}
async function closeReviewedMonth(){
 const r=state.closureReview;if(!r)return;
 if(r.dups.length&&!document.getElementById('duplicates-reviewed')?.checked){alert('Revisa y confirma primero los posibles duplicados.');return}
 if(!confirm('Cerrar '+monthName(r.key+'-01')+' bloqueará altas, ediciones y borrados de ese mes. ¿Continuar?'))return;
 try{await rpc('close_month',{p_household:state.household.id,p_month:r.key+'-01'});await exportWorkbook();await reviewMonthClose();toast('Mes cerrado y Excel generado')}catch(e){alert('No se pudo cerrar el mes: '+e.message)}
}
async function reopenReviewedMonth(){
 const r=state.closureReview;if(!r||!confirm('¿Reabrir '+monthName(r.key+'-01')+' para permitir cambios?'))return;
 try{await rpc('reopen_month',{p_household:state.household.id,p_month:r.key+'-01'});await reviewMonthClose();toast('Mes reabierto')}catch(e){alert('No se pudo reabrir: '+e.message)}
}
function navButton(id,label,icon){return '<button data-view="'+id+'" class="'+(currentView()===id?'active':'')+'"><span class="ni">'+icon+'</span>'+label+'</button>'}
function currentView(){const x=(location.hash||'#inicio').slice(1);return['inicio','movimientos','analisis','patrimonio','ajustes'].includes(x)?x:'inicio'}
function shell(content){
 const initials=(state.member?.display_name||state.user.email||'F').slice(0,1).toUpperCase();
 root.innerHTML='<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">F</div><div class="brand-copy"><b>Finanzas</b><small>'+esc(state.household.name)+'</small></div></div><nav class="nav">'+navButton('inicio','Inicio','⌂')+navButton('movimientos','Movimientos','⇄')+navButton('analisis','Análisis','◔')+navButton('patrimonio','Patrimonio','▥')+navButton('ajustes','Ajustes','⚙')+'</nav><div class="side-foot"><div class="user"><div class="avatar">'+initials+'</div><div class="user-copy"><b>'+esc(state.member?.display_name||'Usuario')+'</b><small>'+esc(state.user.email||'')+'</small></div></div></div></aside>'+
 '<main class="main"><div class="mobile-top"><div class="brand"><div class="logo">F</div><div class="brand-copy"><b>Finanzas</b><small>'+esc(state.household.name)+'</small></div></div><span class="stg">STAGING</span></div>'+content+'</main>'+
 '<nav class="bottom-nav">'+[['inicio','⌂','Inicio'],['movimientos','⇄','Movim.'],['analisis','◔','Análisis'],['patrimonio','▥','Patrim.'],['ajustes','⚙','Ajustes']].map(([id,ic,l])=>'<button data-view="'+id+'" class="'+(currentView()===id?'active':'')+'"><b>'+ic+'</b><span>'+l+'</span></button>').join('')+'</nav><button class="fab" title="Registrar movimiento">+</button></div>';
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.view});
}
function txRows(list,editable=false){
 const cm=Object.fromEntries(state.data.categories.map(c=>[c.id,c.name]));
 return (list||[]).map(t=>{
   const meta=typeMeta(t.type),d=new Date(t.transaction_date+'T12:00:00'),cat=cm[t.category_id]||'Sin categoría';
   const actions=editable?'<div class="tx-actions"><button class="mini" data-edit="'+t.id+'">Editar</button><button class="mini danger" data-delete="'+t.id+'">Borrar</button></div>':'';
   return '<div class="tx '+(editable?'editable':'')+'"><div class="ico '+meta.cls+'">'+meta.icon+'</div><div class="tx-main"><b>'+esc(t.concept)+'</b><span>'+esc(cat)+' · '+esc(t.person_label||'Familia')+' · '+dateFmt.format(d)+'</span></div><div class="amt '+(meta.cls==='in'?'green':meta.cls==='out'?'red':'blue')+'">'+meta.sign+money(t.amount)+'</div>'+actions+'</div>'
 }).join('')||'<div class="empty">No hay movimientos.</div>'
}
function head(ey,title,desc){return '<header class="page-head"><div><span class="eyebrow">'+ey+'</span><h1>'+title+'</h1><p>'+desc+'</p></div><div class="actions"><span class="stg">STAGING</span><button class="btn" id="new-tx">+ Registrar</button><button class="btn" id="refresh">Actualizar</button></div></header>'}
function bindCommon(){const r=document.getElementById('refresh');if(r)r.onclick=async()=>{await loadAll();renderApp()};const n=document.getElementById('new-tx');if(n)n.onclick=openRegister;const f=document.querySelector('.fab');if(f)f.onclick=openRegister}
function viewInicio(){
 const m=state.data.metrics,n=state.data.networth,cashOut=Number(m.expenses||0)+Number(m.invested||0);
 shell(head('Resumen del mes','Inicio','Una vista rápida de caja, coste y patrimonio.')+
 '<section class="metrics"><div class="metric"><span>Ingresos</span><strong class="green">'+money(m.income)+'</strong><small>Caja cobrada</small></div><div class="metric"><span>Gastos reales</span><strong class="red">'+money(m.expenses)+'</strong><small>Consumo pagado</small></div><div class="metric"><span>Salidas de caja</span><strong class="orange">'+money(cashOut)+'</strong><small>Gasto + inversión</small></div><div class="metric"><span>Coste normalizado</span><strong>'+money(m.normalized_cost)+'</strong><small>Coste económico</small></div><div class="metric"><span>Ahorro operativo</span><strong class="'+(Number(m.operating_savings)>=0?'green':'red')+'">'+money(m.operating_savings)+'</strong><small>Ingresos + devoluciones − gastos</small></div><div class="metric"><span>Inversión</span><strong class="purple">'+money(m.invested)+'</strong><small>No es gasto</small></div><div class="metric"><span>Devoluciones</span><strong class="blue">'+money(m.refunds)+'</strong><small>Reduce gasto</small></div><div class="metric"><span>Patrimonio neto</span><strong>'+money(n.net_worth)+'</strong><small>Activos − deudas</small></div></section>'+
 '<section class="grid"><div class="panel"><div class="panel-head"><div><span class="sub">Actividad</span><h2>Últimos movimientos</h2></div><button class="btn" data-go="movimientos">Ver todos</button></div>'+txRows(state.data.transactions.slice(0,8))+'</div><div class="panel"><div class="panel-head"><div><span class="sub">Caja</span><h2>Cuentas</h2></div></div>'+state.data.accounts.map(a=>'<div class="item"><div><strong>'+esc(a.name)+'</strong><br><span>'+esc(a.type)+'</span></div><strong>'+money(a.current_balance)+'</strong></div>').join('')+'</div></section>');
 bindCommon();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash=b.dataset.go)
}
function viewMovimientos(){
 shell(head('Histórico','Movimientos','Consulta y filtra todos los movimientos cargados.')+
 '<section class="panel"><div class="filters"><input id="q" placeholder="Buscar concepto o categoría"><select id="type"><option value="">Todos los tipos</option><option>GASTO</option><option>INGRESO</option><option>INVERSION</option><option>RETIRADA_INVERSION</option><option>TRANSFERENCIA_INTERNA</option><option>DEVOLUCION</option></select><select id="limit"><option value="30">Últimos 30</option><option value="100">Últimos 100</option><option value="500">Últimos 500</option></select></div><div id="txlist"></div></section>');
 bindCommon();const q=document.getElementById('q'),type=document.getElementById('type'),limit=document.getElementById('limit'),cm=Object.fromEntries(state.data.categories.map(c=>[c.id,c.name]));
 function draw(){const term=q.value.trim().toLowerCase(),tp=type.value,n=Number(limit.value);const list=state.data.transactions.filter(t=>(!tp||t.type===tp)&&(!term||(t.concept||'').toLowerCase().includes(term)||(cm[t.category_id]||'').toLowerCase().includes(term))).slice(0,n);document.getElementById('txlist').innerHTML=txRows(list,true);bindTransactionActions()}
 q.oninput=draw;type.onchange=draw;limit.onchange=draw;draw()
}
function viewAnalisis(){
 const b=state.data.breakdown,t=state.data.trend,max=Math.max(1,...b.map(x=>Number(x.amount||0)));
 shell(head('Evolución','Análisis','Tendencias mensuales, categorías y control de cierre.')+
 '<section class="grid"><div class="panel"><div class="panel-head"><div><span class="sub">12 meses</span><h2>Evolución financiera</h2></div></div><div style="overflow:auto"><table class="trend"><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Inversión</th><th>Ahorro</th><th>Normalizado</th></tr></thead><tbody>'+t.map(r=>'<tr><td>'+esc(monthName(r.month))+'</td><td class="green">'+money(r.income)+'</td><td class="red">'+money(r.expenses)+'</td><td class="purple">'+money(r.invested)+'</td><td>'+money(r.operating_savings)+'</td><td>'+money(r.normalized_cost)+'</td></tr>').join('')+'</tbody></table></div></div>'+
 '<div class="panel"><div class="panel-head"><div><span class="sub">Mes actual</span><h2>Gasto por categoría</h2></div></div><div class="bars">'+(b.length?b.map(x=>'<div><div class="bar-head"><span>'+esc(x.category_name)+'</span><strong>'+money(x.amount)+'</strong></div><div class="track"><i style="width:'+Math.max(2,Math.round(Number(x.amount||0)/max*100))+'%"></i></div></div>').join(''):'<div class="empty">Sin gasto categorizado.</div>')+'</div></div></section>'+
 '<section class="panel"><div class="panel-head"><div><span class="sub">Control mensual</span><h2>Cierre y Excel acumulativo</h2></div><span class="chip-ok">AUDITADO</span></div><p style="color:#879bb3;font-size:12px;line-height:1.5;margin:0">Revisa duplicados, bloquea el mes cerrado y genera un Excel con movimientos, resumen mensual, categorías, cuentas, inversiones, patrimonio, periodizaciones, cierres y valoraciones.</p><div class="invite-actions"><button class="btn" id="open-month-close">Revisar cierre mensual</button><button class="btn" id="export-workbook">Exportar Excel ahora</button></div><div class="excel-note">El mes en curso puede revisarse y exportarse, pero no cerrarse hasta su último día.</div></section>');
 bindCommon();document.getElementById('open-month-close').onclick=openMonthClose;document.getElementById('export-workbook').onclick=exportWorkbook
}
function viewPatrimonio(){
 const n=state.data.networth;
 const entity=(title,sub,val,cls='')=>'<div class="entity-card"><span class="sub">'+esc(sub)+'</span><h3>'+esc(title)+'</h3><div class="value '+cls+'">'+money(val)+'</div></div>';
 shell(head('Activos y deudas','Patrimonio','Una vista clara de lo que tenéis, invertís y debéis.')+
 '<section class="wealth-hero"><span class="wealth-label">Patrimonio neto familiar</span><div class="wealth-value">'+money(n.net_worth)+'</div><div class="wealth-meta">Caja '+money(n.cash_accounts)+' · Inversiones '+money(n.investments)+' · Activos '+money(n.other_assets)+' · Deudas '+money(n.liabilities)+'</div></section>'+
 '<section class="metrics"><div class="metric"><span>Cuentas</span><strong>'+money(n.cash_accounts)+'</strong><small>Liquidez conocida</small></div><div class="metric"><span>Inversiones</span><strong class="purple">'+money(n.investments)+'</strong><small>Valor actual</small></div><div class="metric"><span>Otros activos</span><strong>'+money(n.other_assets)+'</strong><small>Bienes valorados</small></div><div class="metric"><span>Deudas</span><strong class="red">'+money(n.liabilities)+'</strong><small>Saldo pendiente</small></div></section>'+
 '<section class="grid equal"><div class="panel"><div class="panel-head"><div><span class="sub">Liquidez</span><h2>Cuentas</h2></div></div>'+state.data.accounts.map(a=>'<div class="item"><div><strong>'+esc(a.name)+'</strong><span>'+esc(a.type)+'</span></div><strong>'+money(a.current_balance)+'</strong></div>').join('')+'</div><div class="panel"><div class="panel-head"><div><span class="sub">Carteras</span><h2>Inversiones</h2></div></div>'+state.data.investments.map(i=>'<div class="item"><div><strong>'+esc(i.name)+'</strong><span>'+esc(i.provider||i.asset_type||'Inversión')+'</span></div><strong>'+money(i.current_value)+'</strong></div>').join('')+'</div></section>'+
 '<div class="section-title"><h2>Activos y deudas</h2><span class="sub">VALOR ACTUAL</span></div><section class="cards">'+state.data.assets.map(a=>entity(a.name,a.type,a.current_value)).concat(state.data.liabilities.map(l=>entity(l.name,l.type,l.outstanding_balance,'red'))).join('')+'</section>');
 bindCommon()
}
async function copyInviteLink(code){
 const u=new URL(location.origin+location.pathname);u.searchParams.set('invite',code);
 try{await navigator.clipboard.writeText(u.toString());toast('Enlace de invitación copiado')}
 catch(e){window.prompt('Copia este enlace y envíaselo:',u.toString())}
}

 try{const code=await createHouseholdInvite();await loadAll();renderApp();toast('Nuevo código: '+String(code||''))}
 catch(e){alert('No se pudo crear la invitación: '+e.message)}

function viewAjustes(){
 const now=Date.now(),active=(state.data.invites||[]).find(i=>!i.revoked_at&&Number(i.uses)<Number(i.max_uses)&&new Date(i.expires_at).getTime()>now);
 const invitePanel=state.member?.role==='OWNER'?'<section class="panel" style="margin-bottom:14px"><div class="panel-head"><div><span class="sub">Compartir hogar</span><h2>Invitar a Bea</h2></div></div>'+
   (active?'<p style="color:#8fa2b9;font-size:12px">Este código permite un único acceso y caduca el '+new Date(active.expires_at).toLocaleDateString('es-ES')+'.</p><div class="join-code">'+esc(active.code)+'</div><div class="invite-actions"><button class="btn" id="copy-invite">Copiar enlace de invitación</button><button class="btn" id="new-invite">Generar otro código</button></div>':'<p style="color:#8fa2b9;font-size:12px">No hay una invitación activa.</p><button class="btn" id="new-invite">Generar código</button>')+
   '</section>':'';
 shell(head('Hogar y aplicación','Ajustes','Miembros, invitaciones, sesión y estado de la aplicación.')+
 invitePanel+
 '<section class="grid equal"><div class="panel"><div class="panel-head"><div><span class="sub">Familia</span><h2>Miembros del hogar</h2></div></div>'+state.data.members.map(m=>'<div class="item"><div><strong>'+esc(m.display_name||'Miembro')+'</strong><br><span>'+esc(m.role)+'</span></div><span>'+new Date(m.joined_at).toLocaleDateString('es-ES')+'</span></div>').join('')+'</div>'+
 '<div class="panel"><div class="panel-head"><div><span class="sub">Aplicación</span><h2>Estado</h2></div></div><div class="settings-list"><div class="setting"><b>Sesión persistente</b><span>Activada y validada en móvil.</span></div><div class="setting"><b>Backend</b><span>Supabase · hogar protegido por RLS.</span></div><div class="setting"><b>Hosting</b><span>GitHub Pages.</span></div><div class="setting"><b>Modo de pruebas</b><span>Altas, edición, borrado, inversión y transferencias ya están validadas. Dos usuarios y sincronización ya validados. Seguimos en staging hasta completar cierre mensual, Excel y revisión visual móvil.</span></div></div><button class="btn" id="logout" style="margin-top:12px">Cerrar sesión</button></div></section>');
 bindCommon();
 const copy=document.getElementById('copy-invite');if(copy&&active)copy.onclick=()=>copyInviteLink(active.code);
 const ni=document.getElementById('new-invite');if(ni)ni.onclick=generateInvite;
 document.getElementById('logout').onclick=async()=>{const ss=getSession();try{if(ss?.access_token)await request('/auth/v1/logout',{method:'POST',headers:{Authorization:'Bearer '+ss.access_token}})}catch(e){}clearSession();state.user=null;renderLogin('Sesión cerrada en este dispositivo.','login')}
}
function renderApp(){startAutoSync();const v=currentView();if(v==='movimientos')viewMovimientos();else if(v==='analisis')viewAnalisis();else if(v==='patrimonio')viewPatrimonio();else if(v==='ajustes')viewAjustes();else viewInicio()}
window.addEventListener('hashchange',()=>{if(state.data)renderApp()});
(async()=>{
 rememberInviteFromUrl();
 const redirect=consumeAuthRedirect();
 try{
   const a=await restore();
   if(!a)return renderLogin(redirect.error?('No se pudo confirmar el acceso: '+redirect.error):undefined);
   await finishAuthenticated(a.user);
 }catch(e){renderLogin('No se pudo cargar la app: '+e.message)}
})();
})();
