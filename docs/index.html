function bankParseCsv(text,delimiter){
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){
   const ch=text[i];
   if(quoted){
     if(ch==='"'&&text[i+1]==='"'){field+='"';i++}
     else if(ch==='"')quoted=false;
     else field+=ch;
   }else if(ch==='"'&&field.trim()===''){quoted=true;field=''}
   else if(ch===delimiter){row.push(field.trim());field=''}
   else if(ch==='\n'||ch==='\r'){
     row.push(field.trim());if(row.some(x=>x!==''))rows.push(row);
     row=[];field='';if(ch==='\r'&&text[i+1]==='\n')i++;
   }else field+=ch;
 }
 if(quoted)throw new Error('El CSV termina dentro de una celda entre comillas.');
 row.push(field.trim());if(row.some(x=>x!==''))rows.push(row);
 return rows;
}

function bankReadCsv(text){

   const rows=bankParseCsv(text.replace(/^\uFEFF/,''),delimiter);

     const columns=bankColumns(rows[i]);
     if(columns.valid&&(!best||rows[i].length>best.width))best={rows,columns,header:i,width:rows[i].length};
   }

 if(!best)throw new Error('No se reconocen las columnas de fecha, concepto e importe (o Debe y Haber). Exporta un CSV con cabeceras.');
 const entries=best.rows.slice(best.header+1).map((cells,i)=>({cells,line:best.header+i+2})).filter(x=>x.cells.some(v=>v!==''));
 if(!entries.length)throw new Error('El CSV no contiene movimientos.');

async function bankBuildRows(parsed,accountId,snapshot){
 const {columns,entries}=parsed,split=columns.debit>=0&&columns.credit>=0;
 if(!entries.length)throw new Error('La hoja no contiene movimientos.');
 if(entries.length>500)throw new Error('El extracto tiene más de 500 filas. Exporta un periodo más corto.');
 const get=(cells,col)=>col>=0?String(cells[col]??'').trim():'';
 const amountAt=(cells,col)=>bankAmount(col>=0?cells[col]:'');
 const emptyAmount=value=>value==null||String(value).trim()===''||/^[+-]?0+(?:[.,]0+)?$/.test(String(value).replace(/[\s\u00a0\u202f€$]/g,''));
 const amounts=entries.map(e=>{
   if(!split)return amountAt(e.cells,columns.amount);
   const debit=amountAt(e.cells,columns.debit),credit=amountAt(e.cells,columns.credit);
   if(!debit&&!emptyAmount(e.cells[columns.debit])||!credit&&!emptyAmount(e.cells[columns.credit]))return null;
   if(!!debit===!!credit)return null;
   return {amount:(debit||credit).amount,sign:debit?-1:1,explicit:true};
 });
 if(!split&&!entries.some((e,i)=>e.cells.length===parsed.width&&amounts[i]?.sign<0)&&entries.some((e,i)=>e.cells.length===parsed.width&&amounts[i]&&amounts[i].sign===0))
   throw new Error('El extracto solo tiene importes positivos sin signo. No se puede distinguir ingresos de gastos; exporta importes con signo o columnas Debe/Haber.');
 const counts=new Map(),rows=[];
 for(let i=0;i<entries.length;i++){
   const e=entries[i],a=amounts[i],date=bankDate(e.cells[columns.date],parsed.date1904);
   const concept=get(e.cells,columns.concept).replace(/\s+/g,' ').slice(0,300);
   const reference=get(e.cells,columns.reference),signed=a?(a.sign<0?-1:1)*a.amount:0;
   const error=e.cells.length!==parsed.width?'El número de columnas no coincide con la cabecera; revisa separadores y comillas.':!date?'Fecha no reconocida.':!a?'Importe o columnas Debe/Haber inválidos.':!concept?'Falta el concepto.':'';
   let type=signed<0?'GASTO':'INGRESO',needsReview=false;
   const interpreted=interpretNatural(concept);
   if(signed<0&&interpreted.type==='INVERSION'){type='INVERSION';needsReview=true}
   if(signed>0&&['DEVOLUCION','RETIRADA_INVERSION'].includes(interpreted.type)){type=interpreted.type;needsReview=type==='RETIRADA_INVERSION'}
   if(/transfer|traspas/.test(norm(concept)))needsReview=true;
   const suggestion=bankCategorySuggestion(concept,type);
   const key=[accountId,date,signed,norm(concept),reference.trim().toUpperCase().replace(/\s+/g,' ')].join('|');
   const occurrence=(counts.get(key)||0)+1;counts.set(key,occurrence);
   const row={line:e.line,date,concept,originalConcept:concept,amount:a?.amount||0,signed,type,accountId,destinationId:'',
     investmentId:'',categoryId:suggestion.id,confidence:suggestion.confidence,reason:suggestion.reason,
     externalId:error?'':await bankExternalId(accountId,date,Math.round(signed*100),concept,reference,occurrence),
     repeated:occurrence>1,needsReview,error,selected:false,existingExact:false,probable:false,manual:false,remember:true};
   rows.push(row);
 }
 bankApplySnapshot(rows,snapshot);
 for(const row of rows){
   row.selected=!bankRowProblem(row,snapshot.closed)&&!row.probable&&!row.repeated&&!row.needsReview&&row.confidence>=.87&&!!row.categoryId;
 }
 return rows;
}

async function saveEditTransaction(id){

 const fail=m=>{err.textContent=m;err.style.display='block';return};
 if(!(amount>0))return fail('El importe debe ser mayor que cero.');
 if(!date||!concept)return fail('Fecha y concepto son obligatorios.');
 if(type==='TRANSFERENCIA_INTERNA'&&(!account||!dest||dest===account))return fail('La transferencia necesita dos cuentas distintas.');
 if((type==='INVERSION'||type==='RETIRADA_INVERSION')&&!investment)return fail('Selecciona la inversión asociada.');
 err.style.display='none';btn.disabled=true;btn.textContent='Guardando…';
 const matchedMember=state.data.members.find(m=>norm(m.display_name)===norm(person));
 const payload={transaction_date:date,amount,concept,type,category_id:category||null,person_user_id:matchedMember?.user_id||null,person_label:person||null,account_id:account||null,destination_account_id:type==='TRANSFERENCIA_INTERNA'?dest:null,investment_id:(type==='INVERSION'||type==='RETIRADA_INVERSION')?investment:null,notes:notes||null,classification_confirmed:true};
 payload.learn_category=FinanceRules.shouldLearn(transactionById(id),category,type,document.getElementById('e-remember').checked);
 if(category!==(transactionById(id)?.category_id||'')||type!==transactionById(id)?.type){payload.classification_confidence=null;payload.classification_reason='Categoría corregida por el hogar.'}
 try{const rows=await updateTransaction(id,payload);if(!rows?.length)throw new Error('No se modificó ningún movimiento.');document.getElementById('edit-modal')?.remove();toast('Movimiento actualizado');await loadAll();renderApp()}
 catch(e){btn.disabled=false;btn.textContent='Guardar cambios';fail(e.message)}
}

const documentFields='id,household_id,transaction_id,transaction_label,transaction_date,filename,mime_type,size_bytes,sha256,object_path,status,archived,created_at,updated_at';
function rememberDocument(record){
 state.data.documents=[record,...(state.data.documents||[]).filter(d=>d.id!==record.id)];
}
async function writeDocument(id,payload){
 const query=id?'?id=eq.'+encodeURIComponent(id)+'&household_id=eq.'+encodeURIComponent(state.household.id):'';
 const rows=await authed('/rest/v1/transaction_documents'+query,{method:id?'PATCH':'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(payload)});
 if(!rows?.length)throw new Error('No se pudo guardar el documento. Actualiza la app y vuelve a intentarlo.');
 rememberDocument(rows[0]);return rows[0];
}
function documentUploadApi(transactionId){
 const h=state.household.id;
 return {
   find:async hash=>(await rest('transaction_documents','household_id=eq.'+h+'&transaction_id=eq.'+transactionId+'&sha256=eq.'+hash+'&select='+documentFields+'&limit=1'))?.[0]||null,
   create:payload=>writeDocument(null,payload),
   upload:async(record,file)=>{
     const session=getSession();
     if(session?.refresh_token&&session.expires_at&&session.expires_at<=Date.now()/1000+60)await refreshSession(session);
     return authed('/storage/v1/object/finanzas-documents/'+record.object_path,{method:'POST',headers:{'Content-Type':record.mime_type,'cache-control':'0','x-upsert':'false'},body:file});
   },
   finalize:record=>writeDocument(record.id,{status:'READY'})
 };
}
async function openTransactionDocuments(transactionId=null){

 back.innerHTML='<div class="modal"><div class="modal-head"><div><span class="eyebrow">Tickets, facturas y justificantes</span><h2>'+esc(tx?'Documentos del movimiento':'Documentos del hogar')+'</h2></div><button class="close" id="documents-close" aria-label="Cerrar">×</button></div>'+

   '<label class="rule-remember"><input id="documents-retired" type="checkbox">Mostrar retirados</label><div id="documents-status" class="bank-help">Cargando documentos…</div><div id="documents-list" class="manage-list"></div></div>';
 document.body.appendChild(back);
 const get=id=>back.querySelector('#'+id),status=get('documents-status'),list=get('documents-list');
 let rows=[],busy=false;

 const setBusy=value=>{busy=value;back.querySelectorAll('button,input').forEach(x=>x.disabled=value)};
 const load=async()=>{
   rows=await restAll('transaction_documents','household_id=eq.'+state.household.id+(transactionId?'&transaction_id=eq.'+transactionId:'')+'&select='+documentFields+'&order=created_at.desc,id.asc');
   rows.forEach(rememberDocument);draw();
 };
 const draw=()=>{
   const visible=rows.filter(d=>get('documents-retired').checked||!d.archived);
   list.innerHTML=visible.length?visible.map(d=>'<div class="manage-row"><div class="manage-main"><strong>'+esc(d.filename)+'</strong><span>'+esc(d.transaction_label)+' · '+esc(d.transaction_date)+'</span><span>'+Math.max(1,Math.round(d.size_bytes/1024))+' KB · '+(d.status==='READY'?'Guardado':'Subida pendiente: vuelve a seleccionar el mismo archivo')+(d.archived?' · Retirado':'')+(!d.transaction_id?' · Movimiento eliminado':'')+'</span></div><div class="document-actions">'+
     (d.status==='READY'?'<button class="mini" data-document-open="'+d.id+'">Abrir</button><button class="mini" data-document-download="'+d.id+'">Descargar</button>':'')+
     (d.transaction_id?'<button class="mini" data-document-toggle="'+d.id+'">'+(d.archived?'Restaurar':'Retirar')+'</button>':'')+'</div></div>').join(''):'<div class="empty">No hay documentos'+(get('documents-retired').checked?'':' activos')+'.'+(tx?' Selecciona un archivo para adjuntarlo.':' Abre un movimiento y pulsa Documentos para adjuntar un archivo.')+'</div>';
   list.querySelectorAll('[data-document-open]').forEach(b=>b.onclick=()=>openFile(b.dataset.documentOpen,false));
   list.querySelectorAll('[data-document-download]').forEach(b=>b.onclick=()=>openFile(b.dataset.documentDownload,true));
   list.querySelectorAll('[data-document-toggle]').forEach(b=>b.onclick=async()=>{
     if(busy)return;const d=rows.find(d=>d.id===b.dataset.documentToggle);if(!d)return;
     setBusy(true);status.textContent='Guardando…';

   });
 };

   }catch(e){status.textContent=saved?'El documento está guardado, pero no se pudo actualizar la lista. Cierra y vuelve a abrir Documentos.':e.message;
     if(!saved)try{await load()}catch{}
   }finally{input.value='';setBusy(false)}
 };
 setBusy(true);
 try{await load();status.textContent=''}catch(e){status.textContent=e.message}finally{setBusy(false)}
}

async function updateAccountPassword(password,currentPassword=null){
 const epoch=sessionEpoch,session=getSession();if(!session||!state.user)throw sessionCancelled();

  return request('/auth/v1/user',{method:'PUT',headers:{Authorization:'Bearer '+restored.session.access_token},body:JSON.stringify({password})});
 }
 assertPrivateAccess();if(!currentPassword)throw Error('Introduce tu contraseña actual.');
 let fresh;try{fresh=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:state.user.email,password:currentPassword})})}catch(err){if(err.sessionCancelled)throw err;throw Error('No se pudo verificar la contraseña actual. Revisa la contraseña y tu conexión.')}
 const user=fresh.user||await currentUser(fresh.access_token);assertSessionEpoch(epoch);assertPrivateAccess();if(user.id!==state.user.id)throw sessionCancelled();
 saveSession({...fresh,user});return authed('/auth/v1/user',{method:'PUT',body:JSON.stringify({password})});
}

function addDaysISO(days){const d=new Date();d.setDate(d.getDate()+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function taskDueText(t){
 if(!t.due_date)return 'Sin fecha';
 const today=todayISO(),tom=addDaysISO(1);
 if(t.due_date===today)return 'Hoy';
 if(t.due_date===tom)return 'Mañana';
 return new Date(t.due_date+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
}
function nextWeekdayISO(day){
 const d=new Date(),delta=(day-d.getDay()+7)%7;d.setDate(d.getDate()+delta);
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
}
function recurrenceLabel(t){
 const f=t?.recurrence_frequency||'NONE',n=Number(t?.recurrence_interval_count||1);
 if(f==='NONE')return '';
 const unit=f==='DAILY'?(n===1?'día':'días'):f==='WEEKLY'?(n===1?'semana':'semanas'):f==='MONTHLY'?(n===1?'mes':'meses'):(n===1?'año':'años');
 return n===1?'Cada '+unit:'Cada '+n+' '+unit
}
function reminderLabel(v){
 if(v===null||v===undefined||v==='')return '';
 const n=Number(v);if(n===0)return 'Aviso el mismo día';if(n===1)return 'Aviso 1 día antes';if(n===7)return 'Aviso 1 semana antes';return 'Aviso '+n+' días antes'

function inferTask(raw){
 let title=String(raw||'').trim(),due='',assigned='',priority='NORMAL',category='',recurrence_frequency='NONE',recurrence_interval_count=1,recurrence_end_date='',reminder_days_before=0;
 let n=norm(title);
 if(n.includes('hoy')){due=todayISO();title=title.replace(/\bhoy\b/i,'').trim()}
 else if(n.includes('mañana')||n.includes('manana')){due=addDaysISO(1);title=title.replace(/\bmañana\b|\bmanana\b/i,'').trim()}
 const weekdays=[['domingo',0],['lunes',1],['martes',2],['miercoles',3],['jueves',4],['viernes',5],['sabado',6]];
 n=norm(title);
 for(const [name,day] of weekdays){
   if(n.includes('cada '+name)){
     recurrence_frequency='WEEKLY';due=due||nextWeekdayISO(day);
     const rx=name==='miercoles'?/cada\s+mi[eé]rcoles/i:name==='sabado'?/cada\s+s[aá]bado/i:new RegExp('cada\\s+'+name,'i');
     title=title.replace(rx,'').trim();break
   }
 }
 if(recurrence_frequency==='NONE'){
   const multi=norm(title).match(/cada\s+(\d+)\s+(dia|dias|semana|semanas|mes|meses|ano|anos)\b/);
   if(multi){
     recurrence_interval_count=Math.max(1,Math.min(60,Number(multi[1])||1));
     const u=multi[2];recurrence_frequency=u.startsWith('dia')?'DAILY':u.startsWith('semana')?'WEEKLY':u.startsWith('mes')?'MONTHLY':'YEARLY';
     due=due||todayISO();title=title.replace(/cada\s+\d+\s+(d[ií]a|d[ií]as|semana|semanas|mes|meses|a[nñ]o|a[nñ]os)\b/i,'').trim()
   }else{
     const single=norm(title).match(/cada\s+(dia|semana|mes|ano)\b/);
     if(single){
       recurrence_frequency=single[1]==='dia'?'DAILY':single[1]==='semana'?'WEEKLY':single[1]==='mes'?'MONTHLY':'YEARLY';
       due=due||todayISO();title=title.replace(/cada\s+(d[ií]a|semana|mes|a[nñ]o)\b/i,'').trim()
     }
   }
 }
 for(const m of state.data.members){
   const display=String(m.display_name||'').trim();if(!display)continue;
   const phrase='para '+norm(display);
   if(norm(title).includes(phrase)){
     const lower=title.toLowerCase(),rawPhrase='para '+display.toLowerCase(),idx=lower.indexOf(rawPhrase);
     assigned=m.user_id;if(idx>=0)title=(title.slice(0,idx)+title.slice(idx+rawPhrase.length)).trim();break
   }
 }
 n=norm(title);if(n.includes('importante')||n.includes('urgente')){priority='IMPORTANTE';title=title.replace(/\b(importante|urgente)\b/ig,'').trim()}
 const nn=norm(title);
 if(/comprar|compra|supermerc|mercadona/.test(nn))category='Compras';
 else if(/miguel|colegio|nino|niño/.test(nn))category='Miguel';
 else if(/coche|tesla|astra|garaje/.test(nn))category='Coche';
 else if(/cita|llamar|pedir|renovar|gesti/.test(nn))category='Gestiones';
 else if(/casa|limpiar|limpieza|ordenar/.test(nn))category='Casa';
 return {title:title.replace(/^[-,:;]+|[-,:;]+$/g,'').trim()||String(raw||'').trim(),due_date:due,assigned_to_user_id:assigned,priority,category,notes:'',reminder_days_before,recurrence_frequency,recurrence_interval_count,recurrence_end_date}
}

function goalRequiredMonthly(g){

async function revokeFamilyInvitation(id){

function bindBackups(){
 const create=document.getElementById('backup-create'),check=document.getElementById('backup-check'),status=document.getElementById('backup-status'),save=document.getElementById('backup-save');
 let busy=false,prepared=null;
 const lock=value=>{busy=value;state.backupBusy=value;create.disabled=value;check.disabled=value};
 create.onclick=async()=>{
   if(busy||state.backupBusy)return;lock(true);save.innerHTML='';prepared=null;
   const household=state.household.id;
   const read=async()=>{
     if(state.household?.id!==household)throw Error('El hogar ha cambiado.');
     const data={};
     for(const table of [...FinanceBackups.TABLES,...FinanceBackups.OPTIONAL_TABLES])data[table]=await restAll(table,'household_id=eq.'+household+'&select=*&order=id.asc');
     data.households=await restAll('households','id=eq.'+household+'&select=*&order=id.asc');

     data.transaction_tags=tags.map(t=>({transaction_id:t.transaction_id,tag_id:t.tag_id}));
     if(data.households.length!==1)throw Error('No se pudo leer el hogar.');
     return data;
   };
   try{
     const result=await FinanceBackups.build({read,zip:zipStore,cryptoImpl:crypto,build:APP_BUILD,progress:text=>status.textContent=text,download:async d=>{
       const signed=await authed('/storage/v1/object/sign/finanzas-documents/'+d.object_path,{method:'POST',body:JSON.stringify({expiresIn:60})});
       const url=FinanceDocuments.signedUrl(SUPA,signed.signedURL,d.filename,false),response=await fetch(url);
       if(!response.ok)throw Error('No se pudo descargar '+d.filename+'.');return new Uint8Array(await response.arrayBuffer());
     }});
     prepared=new File([result.bytes],'Finanzas_copia_'+new Date().toISOString().replace(/[:.]/g,'-')+'.zip',{type:'application/zip'});
     status.textContent='Copia preparada y verificada: '+result.manifest.counts.transactions+' movimientos y '+result.manifest.documents+' documentos.'+(result.manifest.pending_documents?' Hay '+result.manifest.pending_documents+' subidas pendientes sin original.':'')+' Pulsa Guardar para conservarla.';
     save.innerHTML='<button class="btn" id="backup-download">Guardar copia ZIP</button>';
     save.querySelector('button').onclick=async()=>{
       if(!prepared)return;
       try{const url=URL.createObjectURL(prepared),a=document.createElement('a');a.href=url;a.download=prepared.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);

 };

 const section=state.settingsSection||null,rr=state.data.recurring||[],activeRules=rr.filter(r=>r.active);
 const bioOn=lockApplies(),label=lockLabel(),np=state.data.notificationPrefs||{},permission=notificationPermission(),pushOn=!!(np.push_enabled&&(state.data.pushSubscriptions||[]).length&&permission==='granted'),standalone=isStandaloneApp(),supportsPush=pushSupported();

 const recurringPanel='<section class="panel"><div class="panel-head"><div><span class="sub">Automatización</span><h2>Gastos e ingresos recurrentes</h2></div><button class="btn" id="new-recurring">+ Nuevo</button></div><div class="notice" style="margin:0 0 11px"><strong>'+activeRules.length+' reglas activas.</strong> '+rr.filter(r=>r.auto_post).length+' crean movimientos automáticamente al abrir o actualizar la app; el resto sirven como configuración/manual hasta que les asignéis cuenta y activéis el auto-registro.</div>'+(state.recurringRunError?'<div class="status err" style="margin:0 0 11px">No se pudo procesar un vencimiento automático: '+esc(state.recurringRunError)+'</div>':'')+'<div class="manage-list">'+(rr.length?rr.map(r=>'<div class="manage-row"><div class="manage-main"><strong>'+esc(r.name)+'</strong><span>'+esc((state.data.categories.find(c=>c.id===r.category_id)?.name||r.type)+' · '+recurringMeta(r))+'</span></div><div class="manage-side"><strong class="'+(r.type==='INGRESO'?'green':r.type==='INVERSION'?'purple':'')+'">'+money(r.amount)+'</strong><span class="state-chip '+(r.active?'on':'off')+'">'+(r.active?(r.auto_post?'AUTO':'ACTIVO'):'PAUSADO')+'</span><button class="mini" data-recurring="'+r.id+'">Editar</button></div></div>').join(''):'<div class="empty">No hay recurrentes configurados.</div>')+'</div></section>';

 const notificationPanel='<section class="panel"><div class="panel-head"><div><span class="sub">Avisos familiares</span><h2>Notificaciones</h2></div><span class="state-chip '+(pushOn?'on':'off')+'">'+(pushOn?'ACTIVAS':'OPCIONAL')+'</span></div><p style="color:#879bb3;font-size:11px;line-height:1.5;margin:0">Recordatorios de tareas, recurrentes, objetivos, cierre mensual y revisiones de patrimonio. Cada usuario decide qué quiere recibir en su propio dispositivo.</p><div class="notification-toggle-grid">'+notificationToggle('tasks_enabled','Tareas','Vencimientos y pendientes',np.tasks_enabled!==false)+notificationToggle('recurring_enabled','Recurrentes','Pagos e ingresos próximos',np.recurring_enabled!==false)+notificationToggle('goals_enabled','Objetivos','Fechas de metas de ahorro e inversión',np.goals_enabled!==false)+notificationToggle('month_close_enabled','Cierre mensual','Aviso al propietario si el mes sigue abierto',np.month_close_enabled!==false)+notificationToggle('reconciliation_enabled','Patrimonio','Elementos sin conciliar durante 30 días',np.reconciliation_enabled!==false)+'</div><div class="invite-actions">'+(pushOn?'<button class="btn" id="test-notification">Probar notificación</button><button class="btn" id="disable-notifications">Desactivar en este dispositivo</button>':'<button class="btn" id="enable-notifications" '+(!supportsPush||permission==='denied'?'disabled':'')+'>Activar notificaciones del iPhone</button>')+'</div><div class="push-status">'+(!supportsPush?'Este navegador no ofrece Web Push.':permission==='denied'?'El permiso está bloqueado. Puedes rehabilitarlo desde Ajustes del iPhone → Notificaciones → Finanzas.':(/iPhone|iPad|iPod/i.test(navigator.userAgent)&&!standalone?'Para recibir avisos con la app cerrada, abre Finanzas desde el icono añadido a la pantalla de inicio.':pushOn?'El iPhone puede recibir avisos aunque Finanzas esté cerrada.':'La activación requiere un toque tuyo y iOS te pedirá permiso una sola vez.'))+'</div></section>';

 const securityPanel='<section class="panel"><div class="panel-head"><div><span class="sub">Privacidad del dispositivo</span><h2>Seguridad</h2></div><span class="state-chip '+(bioOn?'on':'off')+'">'+(bioOn?'PROTEGIDA':'OPCIONAL')+'</span></div><div class="security-card"><div class="security-head"><div><b>'+(bioOn?'Bloqueo con '+esc(label)+' activado':'Bloquea Finanzas con '+esc(label))+'</b><p>'+(bioOn?'Tras 30 segundos fuera de la app, volverá a pedir '+esc(label)+'. La sesión de Supabase permanece guardada.':'La protección es local a este dispositivo. No se guarda tu rostro ni ningún dato biométrico; iOS realiza la verificación.')+'</p></div></div><div class="invite-actions">'+(bioOn?'<button class="btn" id="lock-now">Bloquear ahora</button><button class="btn" id="disable-device-lock">Desactivar</button>':'<button class="btn" id="enable-device-lock">Activar '+esc(label)+'</button>')+'</div></div><div class="invite-actions"><button class="btn" id="change-password">Cambiar contraseña</button></div></section>';

 const inviteBlock=familyInvitationsPanel();
 const householdPanel='<section class="panel household-settings"><h2>Tu hogar</h2>'+(state.member?.role==='OWNER'?'<form id="household-form"><label class="field">Nombre del hogar<input id="household-name" maxlength="120" required value="'+esc(state.household.name)+'"></label><p class="bank-help">Este nombre lo verán todos los miembros del hogar.</p><button class="save" id="household-save" type="submit">Guardar nombre</button><div class="status" id="household-status" role="status" aria-live="polite"></div></form>':'<p>'+esc(state.household.name)+'</p><p class="bank-help">El propietario puede cambiar el nombre del hogar.</p>')+'</section>';
 const familyPanel=householdPanel+'<section class="panel"><div class="panel-head"><div><span class="sub">Familia</span><h2>Miembros del hogar</h2></div><span class="state-chip on">'+state.data.members.length+' MIEMBROS</span></div>'+state.data.members.map(m=>'<div class="item"><div><strong>'+esc(m.display_name||'Miembro')+'</strong><br><span>'+esc(familyRoleLabel(m.role))+(m.user_id===state.user.id?' · Tú':'')+'</span></div><span>'+new Date(m.joined_at).toLocaleDateString('es-ES')+'</span></div>').join('')+'<div class="notice">Todos los miembros comparten los gastos, el patrimonio, las tareas y la compra. El propietario también administra las invitaciones, el cierre de meses y la restauración de copias.</div>'+inviteBlock+'</section>';

 const appPanel='<section class="panel"><div class="panel-head"><div><span class="sub">Aplicación</span><h2>Estado y sesión</h2></div><span class="state-chip on">v'+APP_BUILD+'</span></div><div class="settings-list"><div class="setting"><b>Sesión persistente</b><span>La app conserva y renueva la sesión. Un fallo de red ya no fuerza a introducir la contraseña otra vez.</span></div><div class="setting"><b>Privacidad local</b><span>'+esc(label)+' puede bloquear la interfaz sin cerrar la sesión.</span></div><div class="setting"><b>Patrimonio editable</b><span>Saldos y valoraciones se guardan con fecha para conservar histórico.</span></div><div class="setting"><b>Actualizaciones</b><span>Versión '+APP_BUILD+' · la app comprueba nuevas versiones automáticamente.</span><div class="invite-actions"><button class="btn" id="check-update">Buscar actualización</button><button class="btn" id="force-refresh">Recargar app</button></div></div><div class="setting"><b>Primer acceso</b><span>Recorre la bienvenida de una familia nueva con datos de ejemplo.</span><button class="btn" id="preview-onboarding">Ver bienvenida</button><button class="btn" id="preview-welcome">Ver presentación de Casuo</button></div><div class="setting"><b>Infraestructura</b><span>Supabase con RLS y auditoría · GitHub Pages.</span></div></div><button class="btn" id="logout" style="margin-top:12px">Cerrar sesión</button></section>';

 if(!section){
   const menu='<div class="settings-summary"><strong style="color:#dfe8f6">Configuración del hogar</strong><br>Hemos agrupado las opciones para que Ajustes sea más rápido de recorrer. Entra solo en la sección que quieras modificar.</div><section class="settings-menu">'+
     settingsMenuCard('recurrentes','↻','Recurrentes','Gastos, ingresos e inversiones periódicas',activeRules.length+' activas',activeRules.length>0)+
     settingsMenuCard('reglas','✦','Reglas inteligentes','Comercios, categorías y aprendizaje de correcciones',(state.data.smartRules||[]).filter(r=>r.active).length+' activas',true)+
     settingsMenuCard('notificaciones','⌁','Notificaciones','Avisos, recordatorios y Web Push',pushOn?'Activas':'Configurar',pushOn)+
     settingsMenuCard('copias','⇩','Copias de seguridad','Descargar y comprobar una copia del hogar','ZIP',true)+
     settingsMenuCard('seguridad','⌾','Seguridad',esc(label)+', privacidad y bloqueo',bioOn?'Protegida':'Opcional',bioOn)+
     settingsMenuCard('familia','⌂','Familia','Miembros e invitaciones del hogar',state.data.members.length+' miembros',true)+
     settingsMenuCard('aplicacion','⚙','Aplicación','Sesión, versión y actualizaciones','v'+APP_BUILD,true)+
     '</section>';
   shell(head('Hogar y aplicación','Ajustes','Configuración organizada por áreas para encontrar cada opción rápidamente.')+menu);
   bindCommon();
   document.querySelectorAll('[data-settings-section]').forEach(b=>b.onclick=()=>{state.settingsSection=b.dataset.settingsSection;viewAjustes()});
   return;
 }

 const sections={
   copias:{ey:'Respaldo',title:'Copias de seguridad',desc:'Conserva una copia independiente de tus datos.',html:backupPanel()},
   reglas:{ey:'Aprendizaje',title:'Reglas inteligentes',desc:'Revisa y ajusta las categorías que recuerda el hogar.',html:categoryRulesPanel()},
   recurrentes:{ey:'Automatización',title:'Recurrentes',desc:'Configura movimientos periódicos y su automatización.',html:recurringPanel},
   notificaciones:{ey:'Avisos',title:'Notificaciones',desc:'Decide qué recordatorios recibe este dispositivo.',html:notificationPanel},
   seguridad:{ey:'Privacidad',title:'Seguridad',desc:'Protege el acceso a la información familiar.',html:securityPanel},
   familia:{ey:'Hogar',title:'Familia',desc:'Gestiona miembros e invitaciones del hogar.',html:familyPanel},
   aplicacion:{ey:'Sistema',title:'Aplicación',desc:'Sesión, actualizaciones y estado técnico.',html:appPanel}
 };
 const cfg=sections[section]||sections.aplicacion;
 shell(head(cfg.ey,cfg.title,cfg.desc,'‹ Más','settings-back')+'<div class="settings-backline"><button class="btn" id="settings-back-mobile">‹ Volver a Más</button><span class="settings-section-title">'+esc(cfg.ey)+'</span></div>'+cfg.html);
 bindCommon();
 const goBack=()=>{state.settingsSection=null;location.hash='mas'};const hb=document.getElementById('settings-back');if(hb)hb.onclick=goBack;const mb=document.getElementById('settings-back-mobile');if(mb)mb.onclick=goBack;

 if(section==='familia'){
  const form=document.getElementById('household-form');if(form)form.onsubmit=async e=>{e.preventDefault();const button=document.getElementById('household-save'),status=document.getElementById('household-status');if(button.disabled)return;button.disabled=true;status.textContent='Guardando…';try{await renameHousehold(document.getElementById('household-name').value);viewAjustes();toast('Nombre del hogar actualizado.')}catch(err){if(err.sessionCancelled)return;button.disabled=false;status.textContent=err.message;status.className='status err'}};
 }
 if(section==='copias'){bindBackups();bindRestoreBackup()}
 if(section==='recurrentes'){
   const nr=document.getElementById('new-recurring');if(nr)nr.onclick=()=>openRecurringEditor(null);
   document.querySelectorAll('[data-recurring]').forEach(b=>b.onclick=()=>openRecurringEditor(b.dataset.recurring));
 }
 if(section==='reglas'){
   document.getElementById('new-category-rule').onclick=()=>openCategoryRuleEditor(null);
   document.querySelectorAll('[data-category-rule]').forEach(b=>b.onclick=()=>openCategoryRuleEditor(b.dataset.categoryRule));
   document.querySelectorAll('[data-toggle-category-rule]').forEach(b=>b.onclick=async()=>{
     const r=state.data.smartRules.find(r=>r.id===b.dataset.toggleCategoryRule);if(!r)return;
     b.disabled=true;
     try{await writeCategoryRule(r.id,{active:!r.active});viewAjustes();toast(r.active?'Regla pausada':'Regla activada')}
     catch(e){b.disabled=false;alert(e.message)}
   });
 }
 if(section==='notificaciones'){
   document.querySelectorAll('[data-notif-pref]').forEach(x=>x.onchange=async()=>{x.disabled=true;try{await saveNotificationPreference(x.dataset.notifPref,x.checked)}catch(e){x.disabled=false;alert(e.message)}});
   const en=document.getElementById('enable-notifications');if(en)en.onclick=async()=>{en.disabled=true;en.textContent='Activando…';try{await enablePushNotifications()}catch(e){en.disabled=false;en.textContent='Activar notificaciones del iPhone';alert(e.message)}};
   const dn=document.getElementById('disable-notifications');if(dn)dn.onclick=async()=>{if(!confirm('¿Desactivar los avisos de este dispositivo?'))return;try{await disablePushNotifications()}catch(e){alert(e.message)}};
   const tn=document.getElementById('test-notification');if(tn)tn.onclick=async()=>{try{await testLocalNotification()}catch(e){alert(e.message)}};
 }
 if(section==='seguridad'){
   const enableLock=document.getElementById('enable-device-lock');if(enableLock)enableLock.onclick=async()=>{enableLock.disabled=true;enableLock.textContent='Activando…';try{await enableDeviceLock();renderApp();toast(lockLabel()+' activado')}catch(e){enableLock.disabled=false;enableLock.textContent='Activar '+lockLabel();alert(e.name==='NotAllowedError'?'No se completó la configuración biométrica.':e.message)}};
   const disableLock=document.getElementById('disable-device-lock');if(disableLock)disableLock.onclick=()=>{if(confirm('¿Desactivar el bloqueo biométrico en este dispositivo?')){clearDeviceLock();state.deviceUnlocked=false;renderApp();toast('Bloqueo biométrico desactivado')}};
   const lockNow=document.getElementById('lock-now');if(lockNow)lockNow.onclick=lockDeviceNow;
 }
 if(section==='familia'){
   document.querySelectorAll('[data-copy-family-invite]').forEach(b=>b.onclick=()=>{const i=(state.data.invites||[]).find(i=>i.id===b.dataset.copyFamilyInvite);if(i&&invitationStatus(i)==='Activa')copyInviteLink(i.code)});
   document.querySelectorAll('[data-cancel-family-invite]').forEach(b=>b.onclick=()=>manageFamilyInvitation('cancel',b.dataset.cancelFamilyInvite));
   const ni=document.getElementById('new-invite');if(ni)ni.onclick=generateInvite;
 }
 if(section==='seguridad'){const cp=document.getElementById('change-password');if(cp)cp.onclick=openPasswordChange}
 if(section==='aplicacion'){
   const welcome=document.getElementById('preview-welcome');if(welcome)welcome.onclick=()=>renderWelcome(true);
   const preview=document.getElementById('preview-onboarding');if(preview)preview.onclick=()=>renderHouseholdSetup({preview:true,householdName:'Hogar de ejemplo',displayName:'Tu nombre',accountName:'Cuenta de ejemplo',balance:'1250'},1);
   const cu=document.getElementById('check-update');if(cu)cu.onclick=()=>checkAppUpdate(true);
   const fr=document.getElementById('force-refresh');if(fr)fr.onclick=forceAppRefresh;
   const lo=document.getElementById('logout');if(lo)lo.onclick=()=>logoutDevice();
 }
}
function renderApp(){if(!guardPrivateView()||!state.data||!state.household)return;startAutoSync();installBackgroundLock();const v=currentView();if(v==='compra')viewCompra();else if(v==='finanzas'||v==='movimientos')viewMovimientos();else if(v==='mas')viewMas();else if(v==='tareas')viewTareas();else if(v==='objetivos')viewObjetivos();else if(v==='analisis')viewAnalisis();else if(v==='patrimonio')viewPatrimonio();else if(v==='ajustes')viewAjustes();else viewInicio()}
window.addEventListener('hashchange',()=>{if(getSession()?.passwordRecovery)renderPasswordReset();else if(state.data)renderApp()});
(async()=>{
 registerNotificationWorker();
 installNotificationWorkerListener();
 checkAppUpdate(false);
 setInterval(()=>{if(!document.hidden)checkAppUpdate(false)},300000);
 rememberInviteFromUrl();
 const redirect=consumeAuthRedirect();
 try{
   const a=await restore();
   if(!a)return renderLogin(redirect.error?('No se pudo confirmar el acceso: '+redirect.error):undefined);
   state.user=a.user;
   if(getSession()?.passwordRecovery){renderPasswordReset();return}
   if(lockApplies(a.user)&&!state.deviceUnlocked){renderDeviceLock();return}
   await finishAuthenticated(a.user);
 }catch(e){if(getSession())renderSessionIssue(e.message);else renderLogin('No se pudo cargar la app: '+e.message)}
})();
})();
</script>
</body>
</html>
