function bankParseCsv(text,delimiter){
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){
   const ch=text[i];
   if(quoted){
     if(ch==='"'&&text[i+1]==='"'){field+='"';i++}
     else if(ch==='"')quoted=false;
     else field+=ch;
   }else if(ch==='"'&&field.trim()===''){quoted=true;field=''}
   else if(ch===delimiter){row.push(field.trim());field=''}
   else if(ch==='\n'||ch==='\r'){
     row.push(field.trim());if(row.some(x=>x!==''))rows.push(row);
     row=[];field='';if(ch==='\r'&&text[i+1]==='\n')i++;
   }else field+=ch;
 }
 if(quoted)throw new Error('El CSV termina dentro de una celda entre comillas.');
 row.push(field.trim());if(row.some(x=>x!==''))rows.push(row);
 return rows;
}
function bankColumns(headings){

function bankReadCsv(text){

   const rows=bankParseCsv(text.replace(/^\uFEFF/,''),delimiter);
   for(let i=0;i<Math.min(20,rows.length);i++){
     const columns=bankColumns(rows[i]);
     if(columns.valid&&(!best||rows[i].length>best.width))best={rows,columns,header:i,width:rows[i].length};
   }
 }
 if(!best)throw new Error('No se reconocen las columnas de fecha, concepto e importe (o Debe y Haber). Exporta un CSV con cabeceras.');
 const entries=best.rows.slice(best.header+1).map((cells,i)=>({cells,line:best.header+i+2})).filter(x=>x.cells.some(v=>v!==''));
 if(!entries.length)throw new Error('El CSV no contiene movimientos.');

function bankDate(raw,date1904=false){

function bankAmount(raw){

 if(s.startsWith('-')||s.endsWith('-')){sign=-1;explicit=true;s=s.replace(/^-|-$/g,'')}

   const p=s.split('.');

async function bankBuildRows(parsed,accountId,snapshot){

 if(entries.length>500)throw new Error('El extracto tiene más de 500 filas. Exporta un periodo más corto.');
 const get=(cells,col)=>col>=0?String(cells[col]??'').trim():'';
 const amountAt=(cells,col)=>bankAmount(col>=0?cells[col]:'');
 const emptyAmount=value=>value==null||String(value).trim()===''||/^[+-]?0+(?:[.,]0+)?$/.test(String(value).replace(/[\s\u00a0\u202f€$]/g,''));
 const amounts=entries.map(e=>{
   if(!split)return amountAt(e.cells,columns.amount);
   const debit=amountAt(e.cells,columns.debit),credit=amountAt(e.cells,columns.credit);
   if(!debit&&!emptyAmount(e.cells[columns.debit])||!credit&&!emptyAmount(e.cells[columns.credit]))return null;
   if(!!debit===!!credit)return null;
   return {amount:(debit||credit).amount,sign:debit?-1:1,explicit:true};
 });
 if(!split&&!entries.some((e,i)=>e.cells.length===parsed.width&&amounts[i]?.sign<0)&&entries.some((e,i)=>e.cells.length===parsed.width&&amounts[i]&&amounts[i].sign===0))
   throw new Error('El extracto solo tiene importes positivos sin signo. No se puede distinguir ingresos de gastos; exporta importes con signo o columnas Debe/Haber.');
 const counts=new Map(),rows=[];
 for(let i=0;i<entries.length;i++){
   const e=entries[i],a=amounts[i],date=bankDate(e.cells[columns.date],parsed.date1904);
   const concept=get(e.cells,columns.concept).replace(/\s+/g,' ').slice(0,300);
   const reference=get(e.cells,columns.reference),signed=a?(a.sign<0?-1:1)*a.amount:0;
   const error=e.cells.length!==parsed.width?'El número de columnas no coincide con la cabecera; revisa separadores y comillas.':!date?'Fecha no reconocida.':!a?'Importe o columnas Debe/Haber inválidos.':!concept?'Falta el concepto.':'';
   let type=signed<0?'GASTO':'INGRESO',needsReview=false;
   const interpreted=interpretNatural(concept);
   if(signed<0&&interpreted.type==='INVERSION'){type='INVERSION';needsReview=true}
   if(signed>0&&['DEVOLUCION','RETIRADA_INVERSION'].includes(interpreted.type)){type=interpreted.type;needsReview=type==='RETIRADA_INVERSION'}
   if(/transfer|traspas/.test(norm(concept)))needsReview=true;
   const suggestion=bankCategorySuggestion(concept,type);
   const key=[accountId,date,signed,norm(concept),reference.trim().toUpperCase().replace(/\s+/g,' ')].join('|');
   const occurrence=(counts.get(key)||0)+1;counts.set(key,occurrence);
   const row={line:e.line,date,concept,originalConcept:concept,amount:a?.amount||0,signed,type,accountId,destinationId:'',
     investmentId:'',categoryId:suggestion.id,confidence:suggestion.confidence,reason:suggestion.reason,
     externalId:error?'':await bankExternalId(accountId,date,Math.round(signed*100),concept,reference,occurrence),
     repeated:occurrence>1,needsReview,error,selected:false,existingExact:false,probable:false,manual:false,remember:true};
   rows.push(row);
 }
 bankApplySnapshot(rows,snapshot);
 for(const row of rows){
   row.selected=!bankRowProblem(row,snapshot.closed)&&!row.probable&&!row.repeated&&!row.needsReview&&row.confidence>=.87&&!!row.categoryId;
 }
 return rows;
}

async function updateAccountPassword(password,currentPassword=null){
 const epoch=sessionEpoch,session=getSession();if(!session||!state.user)throw sessionCancelled();
 if(session.passwordRecovery){
  const restored=await restore();assertSessionEpoch(epoch);if(!restored||restored.user.id!==state.user.id)throw sessionCancelled();
  return request('/auth/v1/user',{method:'PUT',headers:{Authorization:'Bearer '+restored.session.access_token},body:JSON.stringify({password})});
 }
 assertPrivateAccess();if(!currentPassword)throw Error('Introduce tu contraseña actual.');
 let fresh;try{fresh=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:state.user.email,password:currentPassword})})}catch(err){if(err.sessionCancelled)throw err;throw Error('No se pudo verificar la contraseña actual. Revisa la contraseña y tu conexión.')}
 const user=fresh.user||await currentUser(fresh.access_token);assertSessionEpoch(epoch);assertPrivateAccess();if(user.id!==state.user.id)throw sessionCancelled();
 saveSession({...fresh,user});return authed('/auth/v1/user',{method:'PUT',body:JSON.stringify({password})});
}

async function finishAuthenticated(user){

   try{await joinHousehold(pending.code,pending.displayName||user?.user_metadata?.display_name||'');clearPendingJoin();const joined=await loadAll();if(joined){await consumeNotificationLaunch();renderApp();return}}
   catch(e){if(!e.sessionCancelled)renderJoin(e.message);return}
 }
 renderJoin();
}

function inferTask(raw){
 let title=String(raw||'').trim(),due='',assigned='',priority='NORMAL',category='',recurrence_frequency='NONE',recurrence_interval_count=1,recurrence_end_date='',reminder_days_before=0;
 let n=norm(title);
 if(n.includes('hoy')){due=todayISO();title=title.replace(/\bhoy\b/i,'').trim()}
 else if(n.includes('mañana')||n.includes('manana')){due=addDaysISO(1);title=title.replace(/\bmañana\b|\bmanana\b/i,'').trim()}
 const weekdays=[['domingo',0],['lunes',1],['martes',2],['miercoles',3],['jueves',4],['viernes',5],['sabado',6]];
 n=norm(title);
 for(const [name,day] of weekdays){
   if(n.includes('cada '+name)){
     recurrence_frequency='WEEKLY';due=due||nextWeekdayISO(day);
     const rx=name==='miercoles'?/cada\s+mi[eé]rcoles/i:name==='sabado'?/cada\s+s[aá]bado/i:new RegExp('cada\\s+'+name,'i');
     title=title.replace(rx,'').trim();break
   }
 }
 if(recurrence_frequency==='NONE'){
   const multi=norm(title).match(/cada\s+(\d+)\s+(dia|dias|semana|semanas|mes|meses|ano|anos)\b/);
   if(multi){
     recurrence_interval_count=Math.max(1,Math.min(60,Number(multi[1])||1));
     const u=multi[2];recurrence_frequency=u.startsWith('dia')?'DAILY':u.startsWith('semana')?'WEEKLY':u.startsWith('mes')?'MONTHLY':'YEARLY';
     due=due||todayISO();title=title.replace(/cada\s+\d+\s+(d[ií]a|d[ií]as|semana|semanas|mes|meses|a[nñ]o|a[nñ]os)\b/i,'').trim()
   }else{
     const single=norm(title).match(/cada\s+(dia|semana|mes|ano)\b/);
     if(single){
       recurrence_frequency=single[1]==='dia'?'DAILY':single[1]==='semana'?'WEEKLY':single[1]==='mes'?'MONTHLY':'YEARLY';
       due=due||todayISO();title=title.replace(/cada\s+(d[ií]a|semana|mes|a[nñ]o)\b/i,'').trim()
     }
   }
 }
 for(const m of state.data.members){
   const display=String(m.display_name||'').trim();if(!display)continue;
   const phrase='para '+norm(display);
   if(norm(title).includes(phrase)){
     const lower=title.toLowerCase(),rawPhrase='para '+display.toLowerCase(),idx=lower.indexOf(rawPhrase);
     assigned=m.user_id;if(idx>=0)title=(title.slice(0,idx)+title.slice(idx+rawPhrase.length)).trim();break
   }
 }
 n=norm(title);if(n.includes('importante')||n.includes('urgente')){priority='IMPORTANTE';title=title.replace(/\b(importante|urgente)\b/ig,'').trim()}
 const nn=norm(title);
 if(/comprar|compra|supermerc|mercadona/.test(nn))category='Compras';
 else if(/miguel|colegio|nino|niño/.test(nn))category='Miguel';
 else if(/coche|tesla|astra|garaje/.test(nn))category='Coche';
 else if(/cita|llamar|pedir|renovar|gesti/.test(nn))category='Gestiones';
 else if(/casa|limpiar|limpieza|ordenar/.test(nn))category='Casa';
 return {title:title.replace(/^[-,:;]+|[-,:;]+$/g,'').trim()||String(raw||'').trim(),due_date:due,assigned_to_user_id:assigned,priority,category,notes:'',reminder_days_before,recurrence_frequency,recurrence_interval_count,recurrence_end_date}
}

function bindRestoreBackup(){
 const input=document.getElementById('restore-file');if(!input)return;
 const summary=document.getElementById('restore-summary'),status=document.getElementById('restore-status');let backup=null,plan=null;
 const labels={categories:'Categorías',accounts:'Cuentas',assets:'Bienes',investments:'Inversiones',liabilities:'Deudas',payees:'Comercios',tags:'Etiquetas',recurring_rules:'Recurrentes (se recuperan pausados)',transactions:'Movimientos',normalization_schedules:'Periodizaciones',account_balance_snapshots:'Histórico de saldos',investment_valuations:'Valoraciones de inversión',asset_valuations:'Valoraciones de bienes',liability_snapshots:'Histórico de deudas',liability_balance_snapshots:'Saldos de deuda',net_worth_snapshots:'Patrimonio histórico',reconciliations:'Conciliaciones',family_tasks:'Tareas',savings_goals:'Objetivos',budgets:'Presupuestos',category_rules:'Reglas de categoría',shopping_items:'Compra',transaction_documents:'Documentos',monthly_closures:'Cierres',transaction_tags:'Etiquetas de movimientos'};
 const lock=value=>{state.backupBusy=value;input.disabled=value;document.querySelectorAll('#backup-create,#backup-check,#restore-analyze,#restore-apply').forEach(x=>x.disabled=value)};
 const analyze=async()=>{
   if(state.backupBusy||!backup)return;lock(true);plan=null;summary.innerHTML='';status.textContent='Analizando la copia y comprobando referencias…';
   try{
     const r=await rpc('restore_household_backup',{p_household:state.household.id,p_data:backup.data,p_apply:false});
     if(!r.ok)throw Error(r.error);plan=r;
     const missing=Object.values(r.tables).reduce((n,x)=>n+x.add,0);
     summary.innerHTML='<h3>Vista previa</h3><p>'+missing+' registros ausentes · '+r.conflicts.length+' diferentes que se conservarán · '+r.documents.length+' archivos por recuperar.</p><div style="overflow:auto"><table class="trend"><thead><tr><th>Datos</th><th>Recuperar</th><th>Ya existen</th></tr></thead><tbody>'+Object.entries(r.tables).filter(([k,v])=>v.add||v.existing).map(([k,v])=>'<tr><td>'+esc(labels[k]||k)+'</td><td>'+v.add+'</td><td>'+v.existing+'</td></tr>').join('')+'</tbody></table></div>'+(r.conflicts.length?'<details><summary>Ver registros diferentes (se mantiene la versión actual)</summary>'+r.conflicts.slice(0,100).map(x=>'<p>'+esc(labels[x.table]||x.table)+' · '+esc(x.label)+'</p>').join('')+(r.conflicts.length>100?'<p>Se muestran los primeros 100.</p>':'')+'</details>':'')+'<p class="bank-help">Guarda una copia reciente antes de continuar. Los datos se recuperan juntos; después se suben los archivos. Si una subida falla, vuelve a analizar este mismo ZIP para reintentar lo pendiente.</p><div class="invite-actions"><button class="btn" id="restore-analyze">Volver a analizar</button>'+((missing||r.documents.length)?'<button class="save" id="restore-apply">Confirmar recuperación</button>':'')+'</div>';
     summary.querySelector('#restore-analyze').onclick=analyze;
     const apply=summary.querySelector('#restore-apply');if(apply)apply.onclick=applyRestore;
     status.textContent=missing||r.documents.length?'Vista previa lista. Todavía no se ha guardado ningún cambio.':'No hay registros ausentes ni archivos pendientes de recuperar.';
   }catch(e){status.textContent='No se puede continuar: '+e.message}finally{lock(false)}
 };
 const applyRestore=async()=>{
   if(state.backupBusy||!plan)return;
   if(!confirm('¿Recuperar los registros ausentes y los archivos indicados? Las versiones actuales se conservarán y las reglas recurrentes recuperadas quedarán pausadas.'))return;
   lock(true);status.textContent='Recuperando los datos…';let committed=false;
   try{
     const result=await rpc('restore_household_backup',{p_household:state.household.id,p_data:backup.data,p_apply:true,p_expected:plan.token});
     if(!result.ok)throw Error(result.error);committed=true;let uploaded=0;const errors=[];
     for(const entry of result.documents){
       const original=backup.data.transaction_documents.find(d=>d.id===entry.id),bytes=backup.files['documentos/'+entry.id+'.'+original.extension];
       status.textContent='Datos recuperados. Comprobando archivo '+(uploaded+errors.length+1)+' de '+result.documents.length+'…';
       try{
         const d=(await rest('transaction_documents','household_id=eq.'+state.household.id+'&id=eq.'+entry.id+'&select=*'))?.[0];if(!d||!bytes)throw Error('Falta el original o su registro');
         if(d.status!=='READY'){
           try{await authed('/storage/v1/object/finanzas-documents/'+d.object_path,{method:'POST',headers:{'Content-Type':d.mime_type,'x-upsert':'false'},body:bytes})}catch{}
           await writeDocument(d.id,{status:'READY'});
         }
         uploaded++;
       }catch(e){errors.push(original.filename+': '+e.message)}
     }
     summary.innerHTML='<button class="btn" id="restore-analyze">Volver a analizar la misma copia</button>';summary.querySelector('button').onclick=analyze;plan=null;
     status.textContent=errors.length?'Datos recuperados; '+uploaded+' archivos completados y '+errors.length+' pendientes. Vuelve a analizar para reintentar. '+errors.join(' · '):'Recuperación completada: datos guardados y '+uploaded+' archivos recuperados. Actualiza los datos para verlos.';
   }catch(e){plan=null;summary.innerHTML='<button class="btn" id="restore-analyze">Volver a analizar</button>';summary.querySelector('button').onclick=analyze;status.textContent=(committed?'Los datos ya están recuperados. ':'No se pudo confirmar el resultado. Analiza de nuevo antes de reintentar. ')+e.message}finally{lock(false)}
 };
 input.onchange=async()=>{
   if(state.backupBusy)return;const file=input.files?.[0];if(!file)return;backup=null;plan=null;summary.innerHTML='';lock(true);status.textContent='Comprobando integridad del ZIP…';
   try{if(file.size>FinanceBackups.LIMIT)throw Error('El ZIP supera 100 MB.');backup=await FinanceBackups.verify(new Uint8Array(await file.arrayBuffer()),crypto,true);if(backup.manifest.household_id!==state.household.id)throw Error('Esta copia pertenece a otro hogar.');}
   catch(e){backup=null;status.textContent=e.message}finally{lock(false);input.value=''}
   if(backup)await analyze();
 };
}
function bindBackups(){
 const create=document.getElementById('backup-create'),check=document.getElementById('backup-check'),status=document.getElementById('backup-status'),save=document.getElementById('backup-save');
 let busy=false,prepared=null;
 const lock=value=>{busy=value;state.backupBusy=value;create.disabled=value;check.disabled=value};
 create.onclick=async()=>{
   if(busy||state.backupBusy)return;lock(true);save.innerHTML='';prepared=null;
   const household=state.household.id;
   const read=async()=>{
     if(state.household?.id!==household)throw Error('El hogar ha cambiado.');
     const data={};
     for(const table of [...FinanceBackups.TABLES,...FinanceBackups.OPTIONAL_TABLES])data[table]=await restAll(table,'household_id=eq.'+household+'&select=*&order=id.asc');
     data.households=await restAll('households','id=eq.'+household+'&select=*&order=id.asc');
     data.household_members=await restAll('household_members','household_id=eq.'+household+'&select=*&order=user_id.asc');
     const tags=await restAll('transaction_tags','select=transaction_id,tag_id,transactions!inner(household_id)&transactions.household_id=eq.'+household+'&order=transaction_id.asc,tag_id.asc');
     data.transaction_tags=tags.map(t=>({transaction_id:t.transaction_id,tag_id:t.tag_id}));
     if(data.households.length!==1)throw Error('No se pudo leer el hogar.');
     return data;
   };
   try{
     const result=await FinanceBackups.build({read,zip:zipStore,cryptoImpl:crypto,build:APP_BUILD,progress:text=>status.textContent=text,download:async d=>{
       const signed=await authed('/storage/v1/object/sign/finanzas-documents/'+d.object_path,{method:'POST',body:JSON.stringify({expiresIn:60})});
       const url=FinanceDocuments.signedUrl(SUPA,signed.signedURL,d.filename,false),response=await fetch(url);
       if(!response.ok)throw Error('No se pudo descargar '+d.filename+'.');return new Uint8Array(await response.arrayBuffer());
     }});
     prepared=new File([result.bytes],'Finanzas_copia_'+new Date().toISOString().replace(/[:.]/g,'-')+'.zip',{type:'application/zip'});
     status.textContent='Copia preparada y verificada: '+result.manifest.counts.transactions+' movimientos y '+result.manifest.documents+' documentos.'+(result.manifest.pending_documents?' Hay '+result.manifest.pending_documents+' subidas pendientes sin original.':'')+' Pulsa Guardar para conservarla.';
     save.innerHTML='<button class="btn" id="backup-download">Guardar copia ZIP</button>';
     save.querySelector('button').onclick=async()=>{
       if(!prepared)return;
       try{const url=URL.createObjectURL(prepared),a=document.createElement('a');a.href=url;a.download=prepared.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
         status.textContent='Descarga solicitada. Comprueba las descargas del navegador y conserva el archivo ZIP.';
       }catch(e){status.textContent='No se pudo iniciar la descarga: '+e.message}
     };
   }catch(e){status.textContent='No se ha generado la copia: '+e.message}finally{lock(false)}
 };
 check.onchange=async()=>{
   const file=check.files?.[0];if(busy||state.backupBusy||!file)return;lock(true);status.textContent='Comprobando copia en este dispositivo…';
   try{if(file.size>FinanceBackups.LIMIT)throw Error('El archivo supera 100 MB.');const m=await FinanceBackups.verify(new Uint8Array(await file.arrayBuffer()),crypto);status.textContent='Integridad verificada. Copia del '+new Date(m.created_at).toLocaleString('es-ES')+': '+m.counts.transactions+' movimientos, '+m.documents+' documentos.'+(m.pending_documents?' '+m.pending_documents+' subidas pendientes sin original.':'')+' No se ha restaurado ni modificado ningún dato.'}
   catch(e){status.textContent='No se pudo verificar: '+e.message}finally{check.value='';lock(false)}
 };
}

   const en=document.getElementById('enable-notifications');if(en)en.onclick=async()=>{en.disabled=true;en.textContent='Activando…';try{await enablePushNotifications()}catch(e){en.disabled=false;en.textContent='Activar notificaciones del iPhone';alert(e.message)}};
   const dn=document.getElementById('disable-notifications');if(dn)dn.onclick=async()=>{if(!confirm('¿Desactivar los avisos de este dispositivo?'))return;try{await disablePushNotifications()}catch(e){alert(e.message)}};
   const tn=document.getElementById('test-notification');if(tn)tn.onclick=async()=>{try{await testLocalNotification()}catch(e){alert(e.message)}};
 }
 if(section==='seguridad'){
   const enableLock=document.getElementById('enable-device-lock');if(enableLock)enableLock.onclick=async()=>{enableLock.disabled=true;enableLock.textContent='Activando…';try{await enableDeviceLock();renderApp();toast(lockLabel()+' activado')}catch(e){enableLock.disabled=false;enableLock.textContent='Activar '+lockLabel();alert(e.name==='NotAllowedError'?'No se completó la configuración biométrica.':e.message)}};
   const disableLock=document.getElementById('disable-device-lock');if(disableLock)disableLock.onclick=()=>{if(confirm('¿Desactivar el bloqueo biométrico en este dispositivo?')){clearDeviceLock();state.deviceUnlocked=false;renderApp();toast('Bloqueo biométrico desactivado')}};
   const lockNow=document.getElementById('lock-now');if(lockNow)lockNow.onclick=lockDeviceNow;
 }
 if(section==='familia'){
   document.querySelectorAll('[data-copy-family-invite]').forEach(b=>b.onclick=()=>{const i=(state.data.invites||[]).find(i=>i.id===b.dataset.copyFamilyInvite);if(i&&invitationStatus(i)==='Activa')copyInviteLink(i.code)});
   document.querySelectorAll('[data-cancel-family-invite]').forEach(b=>b.onclick=()=>manageFamilyInvitation('cancel',b.dataset.cancelFamilyInvite));
   const ni=document.getElementById('new-invite');if(ni)ni.onclick=generateInvite;
 }
 if(section==='seguridad'){const cp=document.getElementById('change-password');if(cp)cp.onclick=openPasswordChange}
 if(section==='aplicacion'){
   const welcome=document.getElementById('preview-welcome');if(welcome)welcome.onclick=()=>renderWelcome(true);
   const preview=document.getElementById('preview-onboarding');if(preview)preview.onclick=()=>renderHouseholdSetup({preview:true,householdName:'Hogar de ejemplo',displayName:'Tu nombre',accountName:'Cuenta de ejemplo',balance:'1250'},1);
   const cu=document.getElementById('check-update');if(cu)cu.onclick=()=>checkAppUpdate(true);
   const fr=document.getElementById('force-refresh');if(fr)fr.onclick=forceAppRefresh;
   const lo=document.getElementById('logout');if(lo)lo.onclick=()=>logoutDevice();
 }
}
function renderApp(){if(!guardPrivateView()||!state.data||!state.household)return;startAutoSync();installBackgroundLock();const v=currentView();if(v==='compra')viewCompra();else if(v==='finanzas'||v==='movimientos')viewMovimientos();else if(v==='mas')viewMas();else if(v==='tareas')viewTareas();else if(v==='objetivos')viewObjetivos();else if(v==='analisis')viewAnalisis();else if(v==='presupuestos')viewPresupuestos();else if(v==='patrimonio')viewPatrimonio();else if(v==='ajustes')viewAjustes();else viewInicio()}
window.addEventListener('hashchange',()=>{if(getSession()?.passwordRecovery)renderPasswordReset();else if(state.data)renderApp()});
(async()=>{
 registerNotificationWorker();
 installNotificationWorkerListener();
 checkAppUpdate(false);
 setInterval(()=>{if(!document.hidden)checkAppUpdate(false)},300000);
 rememberInviteFromUrl();
 const redirect=consumeAuthRedirect();
 try{
   const a=await restore();
   if(!a)return renderLogin(redirect.error?('No se pudo confirmar el acceso: '+redirect.error):undefined);
   state.user=a.user;
   if(getSession()?.passwordRecovery){renderPasswordReset();return}
   if(lockApplies(a.user)&&!state.deviceUnlocked){renderDeviceLock();return}
   await finishAuthenticated(a.user);
 }catch(e){if(getSession())renderSessionIssue(e.message);else renderLogin('No se pudo cargar la app: '+e.message)}
})();
})();
</script>
</body>
</html>
